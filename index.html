<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>INDUSTRY FUND</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { overflow: hidden; background: #0a0a12; font-family: 'Segoe UI', Arial, sans-serif; touch-action: none; }
        
        /* === MENU INICIAL === */
        #menu {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(180deg, #0a0a1a 0%, #1a1a2e 100%);
            display: flex;
            justify-content: center;
            align-items: center;
            flex-direction: column;
            z-index: 100;
            color: white;
        }
        #menu .title {
            font-size: clamp(36px, 8vw, 72px);
            font-weight: 900;
            letter-spacing: 8px;
            color: #88ccff;
            text-shadow: 0 0 60px rgba(136,204,255,0.2);
            margin-bottom: 8px;
        }
        #menu .subtitle {
            font-size: clamp(12px, 2vw, 18px);
            color: #666;
            letter-spacing: 12px;
            margin-bottom: 40px;
            font-weight: 300;
        }
        #menu .platform-select {
            display: flex;
            gap: 30px;
        }
        #menu .platform-btn {
            padding: 16px 50px;
            font-size: clamp(16px, 2vw, 24px);
            font-weight: 700;
            border: 2px solid #444;
            border-radius: 8px;
            background: transparent;
            color: #aaa;
            cursor: pointer;
            transition: all 0.3s ease;
            letter-spacing: 4px;
            min-width: 140px;
        }
        #menu .platform-btn:hover {
            border-color: #88ccff;
            color: #88ccff;
            background: rgba(136,204,255,0.05);
            transform: scale(1.02);
        }
        #menu .platform-btn:active {
            transform: scale(0.95);
        }
        #menu .platform-btn.pc { border-color: #4a6a8a; }
        #menu .platform-btn.mobile { border-color: #6a4a8a; }
        #menu .platform-btn.pc:hover { border-color: #88ccff; color: #88ccff; }
        #menu .platform-btn.mobile:hover { border-color: #cc88ff; color: #cc88ff; }
        #menu .footer {
            position: absolute;
            bottom: 30px;
            font-size: 11px;
            color: #333;
            letter-spacing: 2px;
        }
        #menu.hidden { display: none; }

        /* === HUD === */
        #hud {
            position: absolute;
            bottom: 30px;
            left: 30px;
            color: rgba(255,255,255,0.5);
            font-size: 13px;
            font-family: monospace;
            pointer-events: none;
            user-select: none;
            z-index: 10;
            line-height: 1.8;
            text-shadow: 0 0 20px rgba(0,0,0,0.9);
        }
        #hud .time { color: #88ccff; font-size: 16px; }
        #hud .pos { color: #888; font-size: 12px; }

        /* === CROSSHAIR === */
        #crosshair {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            color: rgba(255,255,255,0.06);
            font-size: 32px;
            pointer-events: none;
            user-select: none;
            z-index: 10;
        }

        /* === MOBILE CONTROLS === */
        #mobile-controls {
            position: absolute;
            bottom: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 15;
            display: none;
            touch-action: none;
        }
        #mobile-controls.active { display: block; }

        /* Joystick */
        #joystick-area {
            position: absolute;
            bottom: 40px;
            left: 40px;
            width: 120px;
            height: 120px;
            pointer-events: auto;
            touch-action: none;
        }
        #joystick-bg {
            width: 100%;
            height: 100%;
            border-radius: 50%;
            background: rgba(255,255,255,0.06);
            border: 2px solid rgba(255,255,255,0.08);
            position: relative;
            touch-action: none;
        }
        #joystick-knob {
            width: 44px;
            height: 44px;
            border-radius: 50%;
            background: rgba(136,204,255,0.25);
            border: 2px solid rgba(136,204,255,0.15);
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            touch-action: none;
            transition: none;
        }

        /* Botões mobile */
        #mobile-buttons {
            position: absolute;
            bottom: 50px;
            right: 30px;
            display: flex;
            flex-direction: column;
            gap: 12px;
            pointer-events: none;
            touch-action: none;
        }
        .mobile-btn {
            pointer-events: auto;
            touch-action: none;
            padding: 12px 20px;
            font-size: 14px;
            font-weight: 700;
            color: rgba(255,255,255,0.6);
            background: rgba(255,255,255,0.06);
            border: 1px solid rgba(255,255,255,0.08);
            border-radius: 8px;
            cursor: pointer;
            user-select: none;
            min-width: 80px;
            text-align: center;
            transition: all 0.15s;
            font-family: 'Segoe UI', Arial, sans-serif;
            letter-spacing: 1px;
        }
        .mobile-btn:active {
            transform: scale(0.92);
            background: rgba(255,255,255,0.12);
        }
        .mobile-btn.jump { color: #88ccff; border-color: rgba(136,204,255,0.2); }
        .mobile-btn.sprint { color: #cc88ff; border-color: rgba(204,136,255,0.2); }
        .mobile-btn.sprint.active { color: #ff88cc; border-color: rgba(255,136,204,0.3); background: rgba(255,136,204,0.08); }

        /* Bloqueio de cursor */
        #blocker {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.7);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 30;
            cursor: pointer;
            color: white;
            font-size: 22px;
            font-weight: bold;
            flex-direction: column;
            text-shadow: 0 0 30px rgba(0,0,0,0.9);
        }
        #blocker .sub {
            font-size: 14px;
            font-weight: normal;
            margin-top: 12px;
            opacity: 0.4;
            font-family: monospace;
        }
        #blocker.hidden { display: none; }

        /* Loading */
        #loading {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            color: #666;
            font-size: 14px;
            font-family: monospace;
            z-index: 5;
            display: none;
        }
        #loading.active { display: block; }
    </style>
</head>
<body>

    <!-- MENU -->
    <div id="menu">
        <div class="title">INDUSTRY FUND</div>
        <div class="subtitle">— EXPLORE THE INFINITE —</div>
        <div class="platform-select">
            <button class="platform-btn pc" data-platform="pc">🖥 PC</button>
            <button class="platform-btn mobile" data-platform="mobile">📱 MOBILE</button>
        </div>
        <div class="footer">v1.0 · procedural world</div>
    </div>

    <!-- HUD -->
    <div id="hud">
        <div class="time" id="gameTime">⏱ 00:00:00</div>
        <div class="pos" id="playerPos">📍 0.0, 0.0, 0.0</div>
    </div>

    <div id="crosshair">+</div>

    <!-- MOBILE CONTROLS -->
    <div id="mobile-controls">
        <div id="joystick-area">
            <div id="joystick-bg">
                <div id="joystick-knob"></div>
            </div>
        </div>
        <div id="mobile-buttons">
            <button class="mobile-btn jump" id="btnJump">⬆ PULAR</button>
            <button class="mobile-btn sprint" id="btnSprint">🏃 CORRER</button>
        </div>
    </div>

    <!-- BLOCKER -->
    <div id="blocker">
        🏭 Clique para Explorar
        <div class="sub">WASD · Mouse · ESPAÇO(pular) · Q(correr)</div>
    </div>

    <div id="loading">CARREGANDO MUNDO...</div>

    <script type="importmap">
        {
            "imports": {
                "three": "https://unpkg.com/three@0.160.0/build/three.module.js"
            }
        }
    </script>

    <script type="module">
        import * as THREE from 'three';

        // ============================================================
        // 1. CONFIGURAÇÕES
        // ============================================================
        const CONFIG = {
            CHUNK_SIZE: 24,
            VIEW_DISTANCE: 600,
            PLAYER_HEIGHT: 1.6,
            PLAYER_SPEED: 5,
            SPRINT_MULTIPLIER: 5,
            JUMP_FORCE: 5,
            GRAVITY: -16,
            MAX_STRUCTURE_HEIGHT: 14,
            MIN_STRUCTURE_HEIGHT: 3,
            INITIAL_CHUNK_RADIUS: 4,
        };

        // ============================================================
        // 2. DOM
        // ============================================================
        const menu = document.getElementById('menu');
        const blocker = document.getElementById('blocker');
        const gameTimeSpan = document.getElementById('gameTime');
        const playerPosSpan = document.getElementById('playerPos');
        const mobileControls = document.getElementById('mobile-controls');
        const joystickBg = document.getElementById('joystick-bg');
        const joystickKnob = document.getElementById('joystick-knob');
        const btnJump = document.getElementById('btnJump');
        const btnSprint = document.getElementById('btnSprint');
        const loadingEl = document.getElementById('loading');

        let platform = null; // 'pc' ou 'mobile'
        let gameStarted = false;

        // ============================================================
        // 3. THREE.JS - CENA, CÂMERA, RENDER
        // ============================================================
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x12121e);
        scene.fog = new THREE.Fog(0x12121e, 450, 650);

        const camera = new THREE.PerspectiveCamera(70, window.innerWidth / window.innerHeight, 0.1, 700);
        camera.position.set(0, CONFIG.PLAYER_HEIGHT, 0);

        const renderer = new THREE.WebGLRenderer({ 
            antialias: true, 
            powerPreference: "high-performance" 
        });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 1.2));
        renderer.shadowMap.enabled = true;
        renderer.shadowMap.type = THREE.PCFSoftShadowMap;
        renderer.toneMapping = THREE.ACESFilmicToneMapping;
        renderer.toneMappingExposure = 1.2;
        document.body.prepend(renderer.domElement);

        // ============================================================
        // 4. LUZES
        // ============================================================
        const ambient = new THREE.AmbientLight(0x445566, 0.5);
        scene.add(ambient);

        const hemi = new THREE.HemisphereLight(0x8899bb, 0x443322, 0.4);
        scene.add(hemi);

        const sun = new THREE.DirectionalLight(0xffeedd, 1.4);
        sun.position.set(40, 60, 30);
        sun.castShadow = true;
        sun.shadow.mapSize.width = 1024;
        sun.shadow.mapSize.height = 1024;
        sun.shadow.camera.near = 0.5;
        sun.shadow.camera.far = 150;
        sun.shadow.camera.left = -60;
        sun.shadow.camera.right = 60;
        sun.shadow.camera.top = 60;
        sun.shadow.camera.bottom = -60;
        scene.add(sun);

        const fill = new THREE.DirectionalLight(0x8888ff, 0.2);
        fill.position.set(-30, 20, -30);
        scene.add(fill);

        // ============================================================
        // 5. MATERIAIS E GEOMETRIAS (compartilhados)
        // ============================================================
        const materials = {
            wall: new THREE.MeshStandardMaterial({ color: 0x6a7a8a, roughness: 0.7, metalness: 0.3 }),
            wallDark: new THREE.MeshStandardMaterial({ color: 0x4a5a6a, roughness: 0.8, metalness: 0.2 }),
            floor: new THREE.MeshStandardMaterial({ color: 0x5a6a7a, roughness: 0.9, metalness: 0.1 }),
            floorDark: new THREE.MeshStandardMaterial({ color: 0x3a4a5a, roughness: 0.9, metalness: 0.1 }),
            metal: new THREE.MeshStandardMaterial({ color: 0x8a9aaa, roughness: 0.4, metalness: 0.7 }),
            metalDark: new THREE.MeshStandardMaterial({ color: 0x5a6a7a, roughness: 0.5, metalness: 0.6 }),
        };

        const geometries = {
            box: new THREE.BoxGeometry(1, 1, 1),
            cylinder: new THREE.CylinderGeometry(0.5, 0.5, 1, 6),
        };

        // ============================================================
        // 6. SISTEMA DE CHUNKS
        // ============================================================
        const chunks = new Map();
        let gameStartTime = Date.now();
        let totalObjects = 0;
        let chunksGenerated = 0;

        function getChunkKey(cx, cz) {
            return `${cx},${cz}`;
        }

        function getChunkCenter(cx, cz) {
            return {
                x: cx * CONFIG.CHUNK_SIZE + CONFIG.CHUNK_SIZE / 2,
                z: cz * CONFIG.CHUNK_SIZE + CONFIG.CHUNK_SIZE / 2
            };
        }

        function getDistanceToPlayer(cx, cz, playerPos) {
            const center = getChunkCenter(cx, cz);
            const dx = center.x - playerPos.x;
            const dz = center.z - playerPos.z;
            return Math.sqrt(dx*dx + dz*dz);
        }

        // ============================================================
        // 7. GERADOR DE ESTRUTURAS (COM ALTA DENSIDADE)
        // ============================================================
        function generateStructures(cx, cz) {
            const structures = [];
            const center = getChunkCenter(cx, cz);
            const seed = (cx * 73856093 + cz * 19349663 + 83492791) & 0x7fffffff;
            
            const rng = (n) => {
                const s = (seed * 9301 + 49297) % 233280;
                seed = (s * 9301 + 49297) % 233280;
                return (s / 233280) * n;
            };

            // MUITAS estruturas por chunk
            const count = 4 + Math.floor(rng(6));
            
            for (let i = 0; i < count; i++) {
                const x = center.x + (rng(1) - 0.5) * CONFIG.CHUNK_SIZE * 0.75;
                const z = center.z + (rng(1) - 0.5) * CONFIG.CHUNK_SIZE * 0.75;
                const w = 1.5 + rng(5);
                const d = 1.5 + rng(5);
                const h = CONFIG.MIN_STRUCTURE_HEIGHT + rng(CONFIG.MAX_STRUCTURE_HEIGHT - CONFIG.MIN_STRUCTURE_HEIGHT);
                
                structures.push({
                    x, z, w, d, h,
                    type: Math.floor(rng(4)),
                    hasRoof: rng(1) > 0.3,
                    colorVariant: Math.floor(rng(2))
                });
            }
            
            // Conexões
            const connCount = 2 + Math.floor(rng(structures.length));
            for (let i = 0; i < connCount; i++) {
                const a = Math.floor(rng(structures.length));
                const b = Math.floor(rng(structures.length));
                if (a !== b) {
                    structures.push({
                        x: (structures[a].x + structures[b].x) / 2 + (rng(1) - 0.5) * 2,
                        z: (structures[a].z + structures[b].z) / 2 + (rng(1) - 0.5) * 2,
                        w: 1.2 + rng(2),
                        d: 1.2 + rng(2),
                        h: 2 + rng(3),
                        type: 4,
                        isCorridor: true,
                    });
                }
            }
            
            // Plataformas
            for (const s of structures) {
                if (s.h > 4 && rng(1) > 0.4) {
                    structures.push({
                        x: s.x + (rng(1) - 0.5) * s.w * 0.6,
                        z: s.z + (rng(1) - 0.5) * s.d * 0.6,
                        w: 1.5 + rng(2.5),
                        d: 1.5 + rng(2.5),
                        h: 0.2,
                        type: 5,
                        isPlatform: true,
                        platformY: 2 + rng(s.h - 3)
                    });
                }
            }
            
            // Estruturas gigantes
            if (rng(1) > 0.6) {
                structures.push({
                    x: center.x + (rng(1) - 0.5) * CONFIG.CHUNK_SIZE * 0.25,
                    z: center.z + (rng(1) - 0.5) * CONFIG.CHUNK_SIZE * 0.25,
                    w: 6 + rng(8),
                    d: 6 + rng(8),
                    h: 8 + rng(10),
                    type: 0,
                    hasRoof: true,
                    colorVariant: Math.floor(rng(2)),
                    isGiant: true
                });
            }
            
            return structures;
        }

        // ============================================================
        // 8. CONSTRUTOR DE MESHES
        // ============================================================
        function buildStructureMeshes(s) {
            const meshes = [];
            const mat = s.colorVariant === 0 ? materials.wall : materials.wallDark;
            const matFloor = s.colorVariant === 0 ? materials.floor : materials.floorDark;
            const matMetal = s.colorVariant === 0 ? materials.metal : materials.metalDark;
            
            if (s.isCorridor) {
                const floor = new THREE.Mesh(geometries.box, matFloor);
                floor.scale.set(s.w, 0.15, s.d);
                floor.position.set(s.x, 0.1, s.z);
                meshes.push(floor);
                
                if (s.w < 4) {
                    const wall1 = new THREE.Mesh(geometries.box, mat);
                    wall1.scale.set(s.w, s.h, 0.15);
                    wall1.position.set(s.x, s.h/2, s.z + s.d/2);
                    meshes.push(wall1);
                    
                    const wall2 = new THREE.Mesh(geometries.box, mat);
                    wall2.scale.set(s.w, s.h, 0.15);
                    wall2.position.set(s.x, s.h/2, s.z - s.d/2);
                    meshes.push(wall2);
                }
                return meshes;
            }
            
            if (s.isPlatform) {
                const plat = new THREE.Mesh(geometries.box, matMetal);
                plat.scale.set(s.w, 0.15, s.d);
                plat.position.set(s.x, s.platformY || 2, s.z);
                meshes.push(plat);
                
                for (let i = -1; i <= 1; i += 2) {
                    for (let j = -1; j <= 1; j += 2) {
                        const support = new THREE.Mesh(geometries.cylinder, materials.metalDark);
                        support.scale.set(1, s.platformY || 2, 1);
                        support.position.set(
                            s.x + i * s.w * 0.3,
                            (s.platformY || 2) / 2,
                            s.z + j * s.d * 0.3
                        );
                        meshes.push(support);
                    }
                }
                return meshes;
            }
            
            // Estrutura principal
            const w = s.w, d = s.d, h = s.h;
            const x = s.x, z = s.z;
            
            // Piso
            const floor = new THREE.Mesh(geometries.box, matFloor);
            floor.scale.set(w, 0.15, d);
            floor.position.set(x, 0.1, z);
            meshes.push(floor);
            
            // Paredes
            const wallMat = s.type === 0 ? mat : materials.wallDark;
            
            const back = new THREE.Mesh(geometries.box, wallMat);
            back.scale.set(w, h, 0.15);
            back.position.set(x, h/2, z - d/2);
            meshes.push(back);
            
            const front = new THREE.Mesh(geometries.box, wallMat);
            front.scale.set(w, h, 0.15);
            front.position.set(x, h/2, z + d/2);
            meshes.push(front);
            
            const side1 = new THREE.Mesh(geometries.box, wallMat);
            side1.scale.set(0.15, h, d);
            side1.position.set(x - w/2, h/2, z);
            meshes.push(side1);
            
            const side2 = new THREE.Mesh(geometries.box, wallMat);
            side2.scale.set(0.15, h, d);
            side2.position.set(x + w/2, h/2, z);
            meshes.push(side2);
            
            // Teto
            if (s.hasRoof && h > 2) {
                const roof = new THREE.Mesh(geometries.box, matFloor);
                roof.scale.set(w, 0.15, d);
                roof.position.set(x, h, z);
                meshes.push(roof);
            }
            
            // Vigas
            if (h > 3) {
                for (let i = 0; i < Math.min(3, Math.floor(h / 2)); i++) {
                    const beam = new THREE.Mesh(geometries.box, matMetal);
                    beam.scale.set(w + 0.3, 0.08, 0.08);
                    beam.position.set(x, 0.5 + i * 1.6, z - d/2 - 0.08);
                    meshes.push(beam);
                    
                    const beam2 = new THREE.Mesh(geometries.box, matMetal);
                    beam2.scale.set(w + 0.3, 0.08, 0.08);
                    beam2.position.set(x, 0.5 + i * 1.6, z + d/2 + 0.08);
                    meshes.push(beam2);
                }
            }
            
            return meshes;
        }

        // ============================================================
        // 9. CRIAÇÃO DE CHUNK (COM VISIBILIDADE GARANTIDA)
        // ============================================================
        function createChunk(cx, cz) {
            const key = getChunkKey(cx, cz);
            
            if (chunks.has(key)) {
                return;
            }
            
            const structures = generateStructures(cx, cz);
            const group = new THREE.Group();
            const center = getChunkCenter(cx, cz);
            const objects = [];
            
            // Chão
            const floorMesh = new THREE.Mesh(
                new THREE.PlaneGeometry(CONFIG.CHUNK_SIZE, CONFIG.CHUNK_SIZE),
                (cx + cz) % 2 === 0 ? materials.floor : materials.floorDark
            );
            floorMesh.rotation.x = -Math.PI / 2;
            floorMesh.position.set(center.x, 0, center.z);
            floorMesh.receiveShadow = true;
            floorMesh.userData.isCollider = true;
            group.add(floorMesh);
            objects.push(floorMesh);
            
            // Estruturas
            for (const s of structures) {
                const meshes = buildStructureMeshes(s);
                for (const mesh of meshes) {
                    mesh.castShadow = true;
                    mesh.receiveShadow = true;
                    mesh.userData.isCollider = true;
                    group.add(mesh);
                    objects.push(mesh);
                }
            }
            
            // ADICIONA À CENA IMEDIATAMENTE
            scene.add(group);
            chunks.set(key, { 
                group, 
                objects, 
                structures,
                cx, cz,
                visible: true
            });
            
            totalObjects += objects.length;
            chunksGenerated++;
            
            return objects.length;
        }

        // ============================================================
        // 10. GERENCIADOR DE CHUNKS
        // ============================================================
        function updateChunks(playerPos) {
            const cx = Math.floor(playerPos.x / CONFIG.CHUNK_SIZE);
            const cz = Math.floor(playerPos.z / CONFIG.CHUNK_SIZE);
            const radius = Math.ceil(CONFIG.VIEW_DISTANCE / CONFIG.CHUNK_SIZE);
            
            // Cria chunks
            let created = 0;
            for (let dx = -radius; dx <= radius; dx++) {
                for (let dz = -radius; dz <= radius; dz++) {
                    const dist = Math.sqrt(dx*dx + dz*dz) * CONFIG.CHUNK_SIZE;
                    if (dist > CONFIG.VIEW_DISTANCE + CONFIG.CHUNK_SIZE) continue;
                    
                    const chunkX = cx + dx;
                    const chunkZ = cz + dz;
                    const key = getChunkKey(chunkX, chunkZ);
                    
                    if (!chunks.has(key)) {
                        createChunk(chunkX, chunkZ);
                        created++;
                    }
                }
            }
            
            // Remove chunks distantes
            const toRemove = [];
            for (const [key, data] of chunks) {
                const dist = getDistanceToPlayer(data.cx, data.cz, playerPos);
                if (dist > CONFIG.VIEW_DISTANCE + CONFIG.CHUNK_SIZE * 2) {
                    toRemove.push(key);
                }
            }
            
            for (const key of toRemove) {
                const data = chunks.get(key);
                scene.remove(data.group);
                data.objects.forEach(obj => {
                    if (obj.geometry) obj.geometry.dispose();
                    if (obj.material) obj.material.dispose();
                });
                chunks.delete(key);
            }
            
            return created;
        }

        // ============================================================
        // 11. JOGADOR
        // ============================================================
        const player = {
            position: new THREE.Vector3(0, CONFIG.PLAYER_HEIGHT, 0),
            yaw: 0,
            pitch: 0,
            velocity: new THREE.Vector3(0, 0, 0),
            isGrounded: false,
            speed: CONFIG.PLAYER_SPEED,
            isSprinting: false,
            radius: 0.3,
            height: CONFIG.PLAYER_HEIGHT,
        };

        camera.position.copy(player.position);

        // ============================================================
        // 12. COLISÃO
        // ============================================================
        function checkCollision(pos, radius, height) {
            for (const [key, data] of chunks) {
                const chunkPos = getChunkCenter(data.cx, data.cz);
                const dxc = pos.x - chunkPos.x;
                const dzc = pos.z - chunkPos.z;
                if (Math.abs(dxc) > CONFIG.CHUNK_SIZE / 2 + 2 || 
                    Math.abs(dzc) > CONFIG.CHUNK_SIZE / 2 + 2) continue;
                
                for (const obj of data.objects) {
                    if (!obj.userData.isCollider) continue;
                    
                    const box = new THREE.Box3().setFromObject(obj);
                    const center = new THREE.Vector3();
                    const size = new THREE.Vector3();
                    box.getCenter(center);
                    box.getSize(size);
                    
                    const halfW = size.x / 2 + radius;
                    const halfD = size.z / 2 + radius;
                    const halfH = size.y / 2 + height / 2;
                    
                    const dx = pos.x - center.x;
                    const dz = pos.z - center.z;
                    const dy = pos.y - center.y;
                    
                    if (Math.abs(dx) < halfW && Math.abs(dz) < halfD && Math.abs(dy) < halfH) {
                        return true;
                    }
                }
            }
            return false;
        }

        function moveWithCollision(entity, dx, dy, dz) {
            const testX = new THREE.Vector3(entity.position.x + dx, entity.position.y, entity.position.z);
            if (!checkCollision(testX, entity.radius, entity.height)) {
                entity.position.x += dx;
            }
            
            const testY = new THREE.Vector3(entity.position.x, entity.position.y + dy, entity.position.z);
            if (!checkCollision(testY, entity.radius, entity.height)) {
                entity.position.y += dy;
            } else {
                entity.velocity.y = 0;
                entity.isGrounded = true;
            }
            
            const testZ = new THREE.Vector3(entity.position.x, entity.position.y, entity.position.z + dz);
            if (!checkCollision(testZ, entity.radius, entity.height)) {
                entity.position.z += dz;
            }
        }

        // ============================================================
        // 13. MOVIMENTO (compartilhado)
        // ============================================================
        let moveInput = { x: 0, z: 0 };
        let jumpRequested = false;
        let sprintRequested = false;

        function updatePlayer(delta) {
            const speed = player.isSprinting ? CONFIG.PLAYER_SPEED * CONFIG.SPRINT_MULTIPLIER : CONFIG.PLAYER_SPEED;

            // Pulo
            if (jumpRequested && player.isGrounded) {
                player.velocity.y = CONFIG.JUMP_FORCE;
                player.isGrounded = false;
                jumpRequested = false;
            }

            // Gravidade
            player.velocity.y += CONFIG.GRAVITY * delta;
            
            // Movimento
            const forward = new THREE.Vector3(0, 0, -1).applyQuaternion(camera.quaternion);
            forward.y = 0;
            forward.normalize();

            const right = new THREE.Vector3(1, 0, 0).applyQuaternion(camera.quaternion);
            right.y = 0;
            right.normalize();

            const moveDir = new THREE.Vector3();
            if (moveInput.x !== 0 || moveInput.z !== 0) {
                moveDir.add(right.clone().multiplyScalar(moveInput.x));
                moveDir.add(forward.clone().multiplyScalar(-moveInput.z));
                moveDir.normalize().multiplyScalar(speed * delta);
            }

            const dx = moveDir.x;
            const dz = moveDir.z;
            const dy = player.velocity.y * delta;
            
            moveWithCollision(player, dx, dy, dz);

            if (player.position.y < -10) {
                player.position.y = CONFIG.PLAYER_HEIGHT;
                player.velocity.y = 0;
                player.isGrounded = true;
            }

            camera.position.copy(player.position);
            camera.rotation.order = 'YXZ';
            camera.rotation.y = player.yaw;
            camera.rotation.x = player.pitch;

            // Atualiza chunks
            updateChunks(player.position);
            
            // HUD
            const elapsed = Math.floor((Date.now() - gameStartTime) / 1000);
            const hours = String(Math.floor(elapsed / 3600)).padStart(2, '0');
            const minutes = String(Math.floor((elapsed % 3600) / 60)).padStart(2, '0');
            const seconds = String(elapsed % 60).padStart(2, '0');
            gameTimeSpan.textContent = `⏱ ${hours}:${minutes}:${seconds}`;
            playerPosSpan.textContent = `📍 ${player.position.x.toFixed(1)}, ${player.position.y.toFixed(1)}, ${player.position.z.toFixed(1)}`;
        }

        // ============================================================
        // 14. CONTROLES - PC
        // ============================================================
        const pcKeys = { w: false, a: false, s: false, d: false, space: false, q: false };

        function updatePCInput() {
            moveInput.x = (pcKeys.d ? 1 : 0) - (pcKeys.a ? 1 : 0);
            moveInput.z = (pcKeys.s ? 1 : 0) - (pcKeys.w ? 1 : 0);
            
            if (pcKeys.space) {
                jumpRequested = true;
                pcKeys.space = false; // prevenir pulo múltiplo
            }
            
            player.isSprinting = pcKeys.q;
        }

        // Eventos PC
        document.addEventListener('keydown', (e) => {
            if (platform !== 'pc' || !gameStarted) return;
            switch (e.code) {
                case 'KeyW': pcKeys.w = true; e.preventDefault(); break;
                case 'KeyA': pcKeys.a = true; e.preventDefault(); break;
                case 'KeyS': pcKeys.s = true; e.preventDefault(); break;
                case 'KeyD': pcKeys.d = true; e.preventDefault(); break;
                case 'Space': pcKeys.space = true; e.preventDefault(); break;
                case 'KeyQ': pcKeys.q = true; e.preventDefault(); break;
            }
        });
        document.addEventListener('keyup', (e) => {
            if (platform !== 'pc' || !gameStarted) return;
            switch (e.code) {
                case 'KeyW': pcKeys.w = false; e.preventDefault(); break;
                case 'KeyA': pcKeys.a = false; e.preventDefault(); break;
                case 'KeyS': pcKeys.s = false; e.preventDefault(); break;
                case 'KeyD': pcKeys.d = false; e.preventDefault(); break;
                case 'Space': pcKeys.space = false; e.preventDefault(); break;
                case 'KeyQ': pcKeys.q = false; e.preventDefault(); break;
            }
        });

        // Mouse PC
        document.addEventListener('mousemove', (e) => {
            if (platform !== 'pc' || !gameStarted || document.pointerLockElement !== renderer.domElement) return;
            const sens = 0.002;
            player.yaw -= e.movementX * sens;
            player.pitch -= e.movementY * sens;
            player.pitch = Math.max(-1.2, Math.min(1.2, player.pitch));
        });

        // ============================================================
        // 15. CONTROLES - MOBILE
        // ============================================================
        let joystickActive = false;
        let joystickTouchId = null;
        let cameraTouchId = null;
        let lastCameraX = 0;
        let lastCameraY = 0;

        // Joystick
        joystickBg.addEventListener('touchstart', (e) => {
            e.preventDefault();
            const touch = e.changedTouches[0];
            joystickTouchId = touch.identifier;
            joystickActive = true;
            updateJoystick(touch);
        });

        document.addEventListener('touchmove', (e) => {
            for (const touch of e.changedTouches) {
                if (touch.identifier === joystickTouchId) {
                    updateJoystick(touch);
                }
                if (touch.identifier === cameraTouchId) {
                    const dx = touch.clientX - lastCameraX;
                    const dy = touch.clientY - lastCameraY;
                    const sens = 0.005;
                    player.yaw -= dx * sens;
                    player.pitch -= dy * sens;
                    player.pitch = Math.max(-1.2, Math.min(1.2, player.pitch));
                    lastCameraX = touch.clientX;
                    lastCameraY = touch.clientY;
                }
            }
        });

        document.addEventListener('touchend', (e) => {
            for (const touch of e.changedTouches) {
                if (touch.identifier === joystickTouchId) {
                    joystickActive = false;
                    joystickTouchId = null;
                    moveInput.x = 0;
                    moveInput.z = 0;
                    joystickKnob.style.transform = 'translate(-50%, -50%)';
                }
                if (touch.identifier === cameraTouchId) {
                    cameraTouchId = null;
                }
            }
        });

        function updateJoystick(touch) {
            const rect = joystickBg.getBoundingClientRect();
            const cx = rect.left + rect.width / 2;
            const cy = rect.top + rect.height / 2;
            const maxDist = rect.width / 2 - 10;
            
            let dx = touch.clientX - cx;
            let dy = touch.clientY - cy;
            const dist = Math.sqrt(dx*dx + dy*dy);
            
            if (dist > maxDist) {
                dx = (dx / dist) * maxDist;
                dy = (dy / dist) * maxDist;
            }
            
            joystickKnob.style.transform = `translate(${-50 + (dx / maxDist) * 50}%, ${-50 + (dy / maxDist) * 50}%)`;
            
            moveInput.x = dx / maxDist;
            moveInput.z = dy / maxDist;
        }

        // Câmera mobile
        renderer.domElement.addEventListener('touchstart', (e) => {
            if (platform !== 'mobile' || !gameStarted) return;
            for (const touch of e.changedTouches) {
                // Verifica se não é no joystick
                const rect = joystickBg.getBoundingClientRect();
                const isOnJoystick = touch.clientX >= rect.left && touch.clientX <= rect.right &&
                                     touch.clientY >= rect.top && touch.clientY <= rect.bottom;
                if (!isOnJoystick && cameraTouchId === null) {
                    cameraTouchId = touch.identifier;
                    lastCameraX = touch.clientX;
                    lastCameraY = touch.clientY;
                }
            }
        });

        // Botões mobile
        btnJump.addEventListener('touchstart', (e) => {
            e.preventDefault();
            if (platform === 'mobile' && gameStarted) {
                jumpRequested = true;
            }
        });

        btnSprint.addEventListener('touchstart', (e) => {
            e.preventDefault();
            if (platform === 'mobile' && gameStarted) {
                player.isSprinting = !player.isSprinting;
                btnSprint.classList.toggle('active');
                btnSprint.textContent = player.isSprinting ? '🏃 CORRENDO' : '🏃 CORRER';
            }
        });

        // ============================================================
        // 16. INÍCIO DO JOGO
        // ============================================================
        function startGame(selectedPlatform) {
            platform = selectedPlatform;
            gameStarted = true;
            
            menu.classList.add('hidden');
            
            if (platform === 'mobile') {
                mobileControls.classList.add('active');
                // Remove o blocker para mobile
                blocker.classList.add('hidden');
                // Esconde o crosshair
                document.getElementById('crosshair').style.display = 'none';
            } else {
                // PC - mostra blocker para travar o mouse
                blocker.classList.remove('hidden');
            }
            
            // Gera chunks iniciais
            loadingEl.classList.add('active');
            
            // Geração inicial FORÇADA
            const radius = CONFIG.INITIAL_CHUNK_RADIUS;
            let generated = 0;
            for (let dx = -radius; dx <= radius; dx++) {
                for (let dz = -radius; dz <= radius; dz++) {
                    if (dx*dx + dz*dz <= radius*radius) {
                        const chunkX = dx;
                        const chunkZ = dz;
                        const key = getChunkKey(chunkX, chunkZ);
                        if (!chunks.has(key)) {
                            createChunk(chunkX, chunkZ);
                            generated++;
                        }
                    }
                }
            }
            
            console.log(`✅ ${generated} chunks gerados inicialmente`);
            console.log(`📊 Total de objetos: ${totalObjects}`);
            
            loadingEl.classList.remove('active');
            
            // Se for PC, pede para travar o mouse
            if (platform === 'pc') {
                blocker.addEventListener('click', () => {
                    renderer.domElement.requestPointerLock();
                });
                document.addEventListener('pointerlockchange', () => {
                    if (document.pointerLockElement === renderer.domElement) {
                        blocker.classList.add('hidden');
                    } else {
                        blocker.classList.remove('hidden');
                    }
                });
            }
        }

        // ============================================================
        // 17. EVENTOS DO MENU
        // ============================================================
        document.querySelectorAll('.platform-btn').forEach(btn => {
            btn.addEventListener('click', () => {
                const platform = btn.dataset.platform;
                startGame(platform);
            });
        });

        // ============================================================
        // 18. LOOP PRINCIPAL
        // ============================================================
        let lastTime = 0;

        function animate(time) {
            const delta = Math.min((time - lastTime) / 1000, 0.05);
            lastTime = time;

            if (gameStarted) {
                // Atualiza input PC
                if (platform === 'pc') {
                    updatePCInput();
                }
                
                updatePlayer(delta);
            }

            renderer.render(scene, camera);
            requestAnimationFrame(animate);
        }

        animate(0);

        // ============================================================
        // 19. REDIMENSIONAR
        // ============================================================
        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });

        // Previne scroll em mobile
        document.addEventListener('touchmove', (e) => {
            if (gameStarted) e.preventDefault();
        }, { passive: false });

        console.log('🏭 INDUSTRY FUND carregado!');
        console.log('📋 Aguardando seleção de plataforma...');
    </script>
</body>
</html>
