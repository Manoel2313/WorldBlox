<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>Ideal Place for Families</title>
<style>
  :root{
    --gray-950:#0c0d0f;
    --gray-900:#141518;
    --gray-800:#202226;
    --gray-700:#33363b;
    --gray-500:#6b6f76;
    --gray-300:#a8acb3;
    --gray-100:#e4e6e9;
    --accent:#ff6b9d;
    --font-ui: 'Consolas','Courier New',monospace;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent; user-select:none;}
  html,body{margin:0;padding:0;width:100%;height:100%;overflow:hidden;background:#0c0d0f;font-family:var(--font-ui);}
  #renderCanvas{position:absolute;top:0;left:0;width:100%;height:100%;display:block;outline:none;}

  #startScreen{
    position:absolute;inset:0;z-index:50;
    display:flex;flex-direction:column;align-items:center;justify-content:center;
    background:
      linear-gradient(180deg, rgba(12,13,15,0.65), rgba(12,13,15,0.92)),
      repeating-linear-gradient(90deg, #17181b 0px, #17181b 2px, #121316 2px, #121316 64px);
    gap:48px;
  }
  #startTitle{
    font-family:var(--font-ui);
    font-weight:700;
    letter-spacing:14px;
    font-size:clamp(28px,6vw,58px);
    color:var(--gray-100);
    text-transform:uppercase;
    text-align:center;
    text-shadow:0 0 24px rgba(255,107,157,0.15), 0 2px 0 #000;
    border-top:2px solid var(--gray-700);
    border-bottom:2px solid var(--gray-700);
    padding:18px 26px;
  }
  #startSub{
    margin-top:-30px;
    color:var(--gray-500);
    letter-spacing:5px;
    font-size:11px;
    text-transform:uppercase;
  }
  #platformRow{display:flex;gap:22px;flex-wrap:wrap;justify-content:center;}
  .platBtn{
    font-family:var(--font-ui);
    letter-spacing:4px;
    font-size:15px;
    padding:16px 40px;
    color:var(--gray-100);
    background:var(--gray-800);
    border:1px solid var(--gray-700);
    cursor:pointer;
    text-transform:uppercase;
    transition:background .15s, border-color .15s, transform .1s;
  }
  .platBtn:hover{background:var(--gray-700);border-color:var(--accent);}
  .platBtn:active{transform:scale(0.97);}
  .platBtn.active{background:var(--accent);border-color:var(--accent);color:#111;}

  #loadingScreen{
    position:absolute;inset:0;z-index:40;
    display:none;flex-direction:column;align-items:center;justify-content:center;gap:18px;
    background:var(--gray-950);
  }
  #loadingLabel{color:var(--gray-300);letter-spacing:5px;font-size:12px;text-transform:uppercase;}
  #loadingBarOuter{width:min(420px,70vw);height:6px;background:var(--gray-800);border:1px solid var(--gray-700);}
  #loadingBarInner{width:0%;height:100%;background:var(--accent);transition:width .12s linear;}

  #hud{
    position:absolute;top:14px;left:16px;z-index:20;
    color:var(--gray-100);font-family:var(--font-ui);font-size:13px;letter-spacing:1px;
    text-shadow:0 1px 3px rgba(0,0,0,0.9);
    display:none;line-height:1.6;pointer-events:none;
  }
  #hud .lbl{color:var(--gray-500);}
  #hudPos{color:var(--accent);}
  #hudFloor{color:var(--accent);font-weight:bold;}
  #hudRoom{color:var(--gray-300);}

  #crosshair{
    position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);
    width:6px;height:6px;border-radius:50%;background:rgba(230,230,230,0.75);
    z-index:20;display:none;pointer-events:none;
  }
  #pcHint{
    position:absolute;bottom:14px;left:16px;z-index:20;color:var(--gray-500);
    font-family:var(--font-ui);font-size:11px;letter-spacing:1px;display:none;pointer-events:none;
  }

  #mobileControls{
    position:absolute;inset:0;z-index:20;
    display:none;
    pointer-events:none;
  }
  #mobileControls > * { pointer-events:auto; }

  #joystickZone{
    position:absolute;left:20px;bottom:20px;width:120px;height:120px;
    border-radius:50%;
    background:rgba(255,255,255,0.06);
    border:2px solid rgba(255,255,255,0.15);
    backdrop-filter:blur(4px);
    touch-action:none;
    box-shadow:0 0 30px rgba(0,0,0,0.3);
  }
  #joystickKnob{
    position:absolute;left:32px;top:32px;width:56px;height:56px;border-radius:50%;
    background:radial-gradient(circle, rgba(255,255,255,0.25), rgba(255,255,255,0.05));
    border:2px solid rgba(255,255,255,0.2);
    pointer-events:none;
    box-shadow:0 0 20px rgba(255,255,255,0.05);
  }
  .mobileBtn{
    border-radius:50%;
    background:rgba(255,255,255,0.06);
    border:2px solid rgba(255,255,255,0.15);
    backdrop-filter:blur(4px);
    color:var(--gray-100);
    font-family:var(--font-ui);
    font-size:10px;
    letter-spacing:1px;
    display:flex;
    align-items:center;
    justify-content:center;
    touch-action:none;
    box-shadow:0 0 30px rgba(0,0,0,0.3);
    transition:all 0.15s;
    text-shadow:0 1px 4px rgba(0,0,0,0.5);
  }
  .mobileBtn:active{transform:scale(0.92);}

  #btnJump{
    position:absolute;right:20px;bottom:120px;width:72px;height:72px;
    font-size:11px;
    border-color:rgba(255,200,100,0.2);
  }
  #btnJump:active{background:rgba(255,200,100,0.15);}

  #btnRun{
    position:absolute;right:20px;bottom:20px;width:60px;height:60px;
    font-size:9px;
  }
  #btnRun.active{background:var(--accent);border-color:var(--accent);color:#111;}

  #camLookZone{
    position:absolute;inset:0;
    touch-action:none;
    pointer-events:auto;
  }

  #toastMsg{
    position:absolute;top:110px;left:50%;transform:translateX(-50%);
    color:var(--gray-100);font-family:var(--font-ui);font-size:12px;letter-spacing:1px;
    text-shadow:0 1px 3px rgba(0,0,0,0.9);z-index:22;opacity:0;transition:opacity .3s;pointer-events:none;
  }
</style>
</head>
<body>

<canvas id="renderCanvas"></canvas>

<div id="startScreen">
  <div>
    <div id="startTitle">Ideal Place<br>for Families</div>
    <div id="startSub">🏠 EXPLORE • ANDE • DESCUBRA</div>
  </div>
  <div id="platformRow">
    <button class="platBtn" id="btnPC">PC</button>
    <button class="platBtn" id="btnMobile">MOBILE</button>
  </div>
</div>

<div id="loadingScreen">
  <div id="loadingLabel">CARREGANDO 0%</div>
  <div id="loadingBarOuter"><div id="loadingBarInner"></div></div>
</div>

<div id="hud">
  <div><span class="lbl">📍 Posição:</span> <span id="hudPos">0.0, 0.0, 0.0</span></div>
  <div><span class="lbl">🏢 Andar:</span> <span id="hudFloor">0</span></div>
  <div><span class="lbl">🚪 Sala:</span> <span id="hudRoom">---</span></div>
</div>
<div id="crosshair"></div>
<div id="pcHint">WASD mover · ESPAÇO pular · Q correr · R câmera</div>
<div id="toastMsg"></div>

<div id="mobileControls">
  <div id="camLookZone"></div>
  <div id="joystickZone"><div id="joystickKnob"></div></div>
  <button class="mobileBtn" id="btnJump">⬆ PULAR</button>
  <button class="mobileBtn" id="btnRun">🏃 CORRER</button>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
(function(){
"use strict";

/* ======================================================================
   IDEAL PLACE FOR FAMILIES - EXPLORAÇÃO ARQUITETÔNICA
   ====================================================================== */

/* ===== MENU ===== */
let selectedMode = null;

document.getElementById('btnPC').addEventListener('click', ()=>{
  selectedMode = 'pc';
  document.getElementById('startScreen').style.display = 'none';
  beginGame(selectedMode);
});
document.getElementById('btnMobile').addEventListener('click', ()=>{
  selectedMode = 'mobile';
  document.getElementById('startScreen').style.display = 'none';
  beginGame(selectedMode);
});

/* ---------------- CONFIG ---------------- */
let CHUNK_SIZE = 50;
let ACTIVE_RADIUS = 700;
let UNLOAD_MARGIN = 50;
let UNLOAD_RADIUS = ACTIVE_RADIUS + UNLOAD_MARGIN;
let INITIAL_RADIUS = 160;
let FADE_TIME = 0.8;

const WALK_SPEED   = 3.5;
const RUN_MULT     = 4.5;

const EYE_HEIGHT   = 1.6;
const PLAYER_RADIUS = 0.3;
const GRAVITY      = -22;
const JUMP_SPEED_NORMAL = Math.sqrt(2 * Math.abs(GRAVITY) * 1.8);
const JUMP_SPEED_RUN    = Math.sqrt(2 * Math.abs(GRAVITY) * 5);
const MAX_FALL_SPEED = 50;

/* ===== CÂMERA ===== */
let cameraMode = 'third';
const THIRD_PERSON_DISTANCE = 4.5;
const THIRD_PERSON_PITCH_MIN = -0.7;
const THIRD_PERSON_PITCH_MAX = 0.8;

function toggleCamera(){
  cameraMode = cameraMode === 'third' ? 'first' : 'third';
  const btn = document.getElementById('btnCamera');
  if(btn) btn.classList.toggle('active', cameraMode === 'first');
}

/* ---------------- THREE SETUP ---------------- */
const canvas = document.getElementById('renderCanvas');
const renderer = new THREE.WebGLRenderer({
  canvas,
  antialias: true,
  powerPreference: "high-performance"
});
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 1.5));
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.outputEncoding = THREE.sRGBEncoding;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.0;
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;

const isMobile = window.innerWidth < 768;
const FOV = isMobile ? 68 : 75;
const camera = new THREE.PerspectiveCamera(FOV, window.innerWidth/window.innerHeight, 0.1, 12000);
camera.rotation.order = 'YXZ';

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x1a1a2e);
scene.fog = new THREE.Fog(0x1a1a2e, 80, ACTIVE_RADIUS + 50);

const ambientLight = new THREE.AmbientLight(0x8899aa, 0.5);
scene.add(ambientLight);

const hemisphereLight = new THREE.HemisphereLight(0xdfe6ea, 0x3a3d42, 0.6);
scene.add(hemisphereLight);

const sunLight = new THREE.DirectionalLight(0xffeedd, 1.0);
sunLight.position.set(120, 180, 80);
sunLight.castShadow = true;
sunLight.shadow.mapSize.width = 2048;
sunLight.shadow.mapSize.height = 2048;
sunLight.shadow.camera.near = 0.5;
sunLight.shadow.camera.far = 400;
sunLight.shadow.camera.left = -120;
sunLight.shadow.camera.right = 120;
sunLight.shadow.camera.top = 120;
sunLight.shadow.camera.bottom = -120;
scene.add(sunLight);

const fillLight = new THREE.DirectionalLight(0x6688bb, 0.25);
fillLight.position.set(-100, 80, -100);
scene.add(fillLight);

function onResize(){
  const w = window.innerWidth;
  const h = window.innerHeight;
  camera.aspect = w/h;
  camera.fov = (w < 768) ? 68 : 75;
  camera.updateProjectionMatrix();
  renderer.setSize(w, h);
}
window.addEventListener('resize', onResize);
onResize();

/* ===== PERSONAGEM ===== */
const playerGroup = new THREE.Group();
scene.add(playerGroup);

function createPlayer(){
  while(playerGroup.children.length > 0){
    const child = playerGroup.children[0];
    playerGroup.remove(child);
    child.traverse(o=>{ if(o.geometry) o.geometry.dispose(); if(o.material) o.material.dispose(); });
  }

  const bodyMat = new THREE.MeshStandardMaterial({ color: 0x4a6fa5, roughness: 0.6, metalness: 0.1 });
  const skinMat = new THREE.MeshStandardMaterial({ color: 0xf5d0b8, roughness: 0.7 });
  const pantsMat = new THREE.MeshStandardMaterial({ color: 0x2d4059, roughness: 0.8 });
  const shoesMat = new THREE.MeshStandardMaterial({ color: 0x222222, roughness: 0.9 });

  // Corpo
  const torso = new THREE.Mesh(new THREE.BoxGeometry(0.6, 0.6, 0.35), bodyMat);
  torso.position.y = 0.8;
  torso.castShadow = true;
  playerGroup.add(torso);

  // Cabeça
  const head = new THREE.Mesh(new THREE.SphereGeometry(0.22, 10, 10), skinMat);
  head.position.y = 1.35;
  head.castShadow = true;
  playerGroup.add(head);

  // Cabelo
  const hairMat = new THREE.MeshStandardMaterial({ color: 0x5d3a1a, roughness: 0.9 });
  const hair = new THREE.Mesh(new THREE.SphereGeometry(0.24, 8, 8), hairMat);
  hair.scale.set(1, 0.4, 1);
  hair.position.set(0, 1.45, 0);
  playerGroup.add(hair);

  // Braços
  const armMat = new THREE.MeshStandardMaterial({ color: 0xf5d0b8, roughness: 0.7 });
  for(const side of [-1, 1]){
    const arm = new THREE.Mesh(new THREE.CylinderGeometry(0.06, 0.07, 0.5, 6), armMat);
    arm.position.set(side * 0.4, 0.95, 0);
    arm.rotation.z = side * 0.15;
    arm.castShadow = true;
    playerGroup.add(arm);
  }

  // Pernas
  for(const side of [-1, 1]){
    const leg = new THREE.Mesh(new THREE.CylinderGeometry(0.08, 0.09, 0.5, 6), pantsMat);
    leg.position.set(side * 0.15, 0.35, 0);
    leg.castShadow = true;
    playerGroup.add(leg);
    
    const shoe = new THREE.Mesh(new THREE.BoxGeometry(0.12, 0.06, 0.2), shoesMat);
    shoe.position.set(side * 0.15, 0.08, 0.04);
    playerGroup.add(shoe);
  }

  playerGroup.position.y = 0;
  playerGroup.visible = true;
}

/* ===== TOAST ===== */
let toastTimer = null;
function showToast(msg){
  const el = document.getElementById('toastMsg');
  el.textContent = msg;
  el.style.opacity = '1';
  if(toastTimer) clearTimeout(toastTimer);
  toastTimer = setTimeout(()=>{ el.style.opacity='0'; }, 2000);
}

/* ===== GEOMETRIA ===== */
const UNIT_BOX = new THREE.BoxGeometry(1,1,1).toNonIndexed();
const BASE_POS = UNIT_BOX.attributes.position.array;
const BASE_NORM = UNIT_BOX.attributes.normal.array;
const VERTS_PER_BOX = BASE_POS.length/3;

function box(x,y,z,w,h,d,color){
  return {x,y,z,w,h,d,color: new THREE.Color(color)};
}

/* ===== CORES ===== */
const COLORS = {
  vermelho: 0xdd3355,
  azul: 0x3377dd,
  verde: 0x33cc77,
  roxo: 0x9944cc,
  amarelo: 0xddcc33,
  ciano: 0x33dddd,
  rosa: 0xff66aa,
  cinza: 0x8899aa,
  cinza_escuro: 0x445566,
  branco: 0xeeeedd,
  bege: 0xddccbb,
};

function randomColor(){
  const keys = ['vermelho','azul','verde','roxo','amarelo','ciano','rosa'];
  return COLORS[keys[Math.floor(Math.random() * keys.length)]];
}

function randomLightColor(){
  const keys = ['amarelo','ciano','rosa','bege','branco'];
  return COLORS[keys[Math.floor(Math.random() * keys.length)]];
}

/* ===== GERADOR DE ARQUITETURA ===== */
function hashSeed(cx, cz, cy, salt){
  let h = 2166136261;
  h = Math.imul(h ^ (cx|0), 16777619);
  h = Math.imul(h ^ (cz|0), 16777619);
  h = Math.imul(h ^ (cy|0), 16777619);
  h = Math.imul(h ^ (salt|0), 16777619);
  h = Math.imul(h ^ 0x9e3779b9, 16777619);
  return h>>>0;
}

function mulberry32(a){
  return function(){
    a |= 0; a = (a + 0x6D2B79F5) | 0;
    let t = Math.imul(a ^ (a>>>15), 1 | a);
    t = (t + Math.imul(t ^ (t>>>7), 61 | t)) ^ t;
    return ((t ^ (t>>>14))>>>0) / 4294967296;
  };
}

function generateArchitecture(cx, cz, floor){
  const rng = mulberry32(hashSeed(cx, cz, floor, 0xABCD));
  const boxes = [];
  const ox = cx * CHUNK_SIZE;
  const oz = cz * CHUNK_SIZE;
  const yBase = floor * 4; // Cada andar tem 4 unidades de altura
  
  // ===== CHÃO =====
  const floorColor = (floor % 2 === 0) ? COLORS.cinza_escuro : COLORS.cinza;
  boxes.push(box(ox + CHUNK_SIZE/2, yBase, oz + CHUNK_SIZE/2, CHUNK_SIZE, 0.2, CHUNK_SIZE, floorColor));
  
  // ===== TETO =====
  const ceilColor = (floor % 2 === 0) ? COLORS.branco : COLORS.bege;
  boxes.push(box(ox + CHUNK_SIZE/2, yBase + 4, oz + CHUNK_SIZE/2, CHUNK_SIZE, 0.2, CHUNK_SIZE, ceilColor));
  
  // ===== PAREDES EXTERNAS =====
  const wallColor = (floor % 3 === 0) ? COLORS.azul : (floor % 3 === 1) ? COLORS.roxo : COLORS.verde;
  const wallH = 3.8;
  
  // Paredes com aberturas (portas/janelas)
  const hasDoorNorth = rng() < 0.3;
  const hasDoorSouth = rng() < 0.3;
  const hasDoorEast = rng() < 0.3;
  const hasDoorWest = rng() < 0.3;
  
  // Parede Norte
  if(!hasDoorNorth){
    boxes.push(box(ox + CHUNK_SIZE/2, yBase + wallH/2, oz, CHUNK_SIZE, wallH, 0.2, wallColor));
  } else {
    // Porta no norte
    const doorW = 1.2;
    const doorH = 2.4;
    // Paredes ao redor da porta
    boxes.push(box(ox + (CHUNK_SIZE - doorW)/4, yBase + wallH/2, oz, (CHUNK_SIZE - doorW)/2, wallH, 0.2, wallColor));
    boxes.push(box(ox + CHUNK_SIZE - (CHUNK_SIZE - doorW)/4, yBase + wallH/2, oz, (CHUNK_SIZE - doorW)/2, wallH, 0.2, wallColor));
    boxes.push(box(ox + CHUNK_SIZE/2, yBase + doorH + (wallH - doorH)/2, oz, doorW, wallH - doorH, 0.2, wallColor));
    // Porta (visual)
    boxes.push(box(ox + CHUNK_SIZE/2, yBase + doorH/2, oz + 0.15, doorW, doorH, 0.1, COLORS.rosa));
  }
  
  // Parede Sul
  if(!hasDoorSouth){
    boxes.push(box(ox + CHUNK_SIZE/2, yBase + wallH/2, oz + CHUNK_SIZE, CHUNK_SIZE, wallH, 0.2, wallColor));
  } else {
    const doorW = 1.2;
    const doorH = 2.4;
    boxes.push(box(ox + (CHUNK_SIZE - doorW)/4, yBase + wallH/2, oz + CHUNK_SIZE, (CHUNK_SIZE - doorW)/2, wallH, 0.2, wallColor));
    boxes.push(box(ox + CHUNK_SIZE - (CHUNK_SIZE - doorW)/4, yBase + wallH/2, oz + CHUNK_SIZE, (CHUNK_SIZE - doorW)/2, wallH, 0.2, wallColor));
    boxes.push(box(ox + CHUNK_SIZE/2, yBase + doorH + (wallH - doorH)/2, oz + CHUNK_SIZE, doorW, wallH - doorH, 0.2, wallColor));
    boxes.push(box(ox + CHUNK_SIZE/2, yBase + doorH/2, oz + CHUNK_SIZE - 0.15, doorW, doorH, 0.1, COLORS.rosa));
  }
  
  // Parede Leste
  if(!hasDoorEast){
    boxes.push(box(ox + CHUNK_SIZE, yBase + wallH/2, oz + CHUNK_SIZE/2, 0.2, wallH, CHUNK_SIZE, wallColor));
  } else {
    const doorW = 1.2;
    const doorH = 2.4;
    boxes.push(box(ox + CHUNK_SIZE, yBase + wallH/2, oz + (CHUNK_SIZE - doorW)/4, 0.2, wallH, (CHUNK_SIZE - doorW)/2, wallColor));
    boxes.push(box(ox + CHUNK_SIZE, yBase + wallH/2, oz + CHUNK_SIZE - (CHUNK_SIZE - doorW)/4, 0.2, wallH, (CHUNK_SIZE - doorW)/2, wallColor));
    boxes.push(box(ox + CHUNK_SIZE, yBase + doorH + (wallH - doorH)/2, oz + CHUNK_SIZE/2, 0.2, wallH - doorH, doorW, wallColor));
    boxes.push(box(ox + CHUNK_SIZE - 0.15, yBase + doorH/2, oz + CHUNK_SIZE/2, 0.1, doorH, doorW, COLORS.rosa));
  }
  
  // Parede Oeste
  if(!hasDoorWest){
    boxes.push(box(ox, yBase + wallH/2, oz + CHUNK_SIZE/2, 0.2, wallH, CHUNK_SIZE, wallColor));
  } else {
    const doorW = 1.2;
    const doorH = 2.4;
    boxes.push(box(ox, yBase + wallH/2, oz + (CHUNK_SIZE - doorW)/4, 0.2, wallH, (CHUNK_SIZE - doorW)/2, wallColor));
    boxes.push(box(ox, yBase + wallH/2, oz + CHUNK_SIZE - (CHUNK_SIZE - doorW)/4, 0.2, wallH, (CHUNK_SIZE - doorW)/2, wallColor));
    boxes.push(box(ox, yBase + doorH + (wallH - doorH)/2, oz + CHUNK_SIZE/2, 0.2, wallH - doorH, doorW, wallColor));
    boxes.push(box(ox + 0.15, yBase + doorH/2, oz + CHUNK_SIZE/2, 0.1, doorH, doorW, COLORS.rosa));
  }
  
  // ===== JANELAS =====
  const hasWindowNorth = rng() < 0.4 && !hasDoorNorth;
  const hasWindowSouth = rng() < 0.4 && !hasDoorSouth;
  const hasWindowEast = rng() < 0.4 && !hasDoorEast;
  const hasWindowWest = rng() < 0.4 && !hasDoorWest;
  
  if(hasWindowNorth){
    const wPos = ox + CHUNK_SIZE * (0.2 + rng() * 0.6);
    boxes.push(box(wPos, yBase + 2.2, oz + 0.15, 0.8, 1.2, 0.1, COLORS.ciano));
    boxes.push(box(wPos, yBase + 2.2, oz, 0.9, 1.3, 0.05, COLORS.branco));
  }
  if(hasWindowSouth){
    const wPos = ox + CHUNK_SIZE * (0.2 + rng() * 0.6);
    boxes.push(box(wPos, yBase + 2.2, oz + CHUNK_SIZE - 0.15, 0.8, 1.2, 0.1, COLORS.ciano));
    boxes.push(box(wPos, yBase + 2.2, oz + CHUNK_SIZE, 0.9, 1.3, 0.05, COLORS.branco));
  }
  if(hasWindowEast){
    const wPos = oz + CHUNK_SIZE * (0.2 + rng() * 0.6);
    boxes.push(box(ox + CHUNK_SIZE - 0.15, yBase + 2.2, wPos, 0.1, 1.2, 0.8, COLORS.ciano));
    boxes.push(box(ox + CHUNK_SIZE, yBase + 2.2, wPos, 0.05, 1.3, 0.9, COLORS.branco));
  }
  if(hasWindowWest){
    const wPos = oz + CHUNK_SIZE * (0.2 + rng() * 0.6);

  // ===== SALAS INTERNAS =====

  // ===== SALAS PEQUENAS (5m³) =====

    boxes.push(box(rx, yBase + wallH/2, rz + roomSize/2, 0.1, wallH, roomSize, roomColor));

  }
  
  // ===== CORREDORES =====
  // Corredor longo (até 500m)
  if(rng() < 0.2){

      // Paredes

      boxes.push(box(startX + length/2, yBase + wallH/2, startZ + corridorWidth/2, length, wallH, 0.1, corridorColor));
      // Teto
      boxes.push(box(startX + length/2, yBase + wallH, startZ, length, 0.1, corridorWidth, COLORS.branco));
      // Luminárias

      boxes.push(box(startX - corridorWidth/2, yBase + wallH/2, startZ + length/2, 0.1, wallH, length, corridorColor));

      for(let lz = startZ + 2; lz < startZ + length - 2; lz += 4){

  }
  
  // ===== ESCADARIAS =====
  if(rng() < 0.25){
    const stairX = ox + 2 + rng() * (CHUNK_SIZE - 10);

      // Corrimão esquerdo

        boxes.push(box(sx + stepD/2, sy + 1.0, stairZ - stepW/2 - 0.15, stepD * 0.8, 0.05, 0.05, COLORS.cinza));
      }
      // Corrimão direito
      if(i % 3 === 1){

  // ===== PILARES =====

  // ===== ELEMENTOS DECORATIVOS =====
  // Rodapé
  const baseboardColor = COLORS.cinza_escuro;
  boxes.push(box(ox + CHUNK_SIZE/2, yBase + 0.1, oz + 0.1, CHUNK_SIZE - 0.2, 0.1, 0.1, baseboardColor));
  boxes.push(box(ox + CHUNK_SIZE/2, yBase + 0.1, oz + CHUNK_SIZE - 0.1, CHUNK_SIZE - 0.2, 0.1, 0.1, baseboardColor));
  boxes.push(box(ox + 0.1, yBase + 0.1, oz + CHUNK_SIZE/2, 0.1, 0.1, CHUNK_SIZE - 0.2, baseboardColor));
  boxes.push(box(ox + CHUNK_SIZE - 0.1, yBase + 0.1, oz + CHUNK_SIZE/2, 0.1, 0.1, CHUNK_SIZE - 0.2, baseboardColor));

  const corniceColor = COLORS.branco;
  boxes.push(box(ox + CHUNK_SIZE/2, yBase + wallH - 0.1, oz + 0.1, CHUNK_SIZE - 0.2, 0.1, 0.1, corniceColor));
  boxes.push(box(ox + CHUNK_SIZE/2, yBase + wallH - 0.1, oz + CHUNK_SIZE - 0.1, CHUNK_SIZE - 0.2, 0.1, 0.1, corniceColor));
  boxes.push(box(ox + 0.1, yBase + wallH - 0.1, oz + CHUNK_SIZE/2, 0.1, 0.1, CHUNK_SIZE - 0.2, corniceColor));
  boxes.push(box(ox + CHUNK_SIZE - 0.1, yBase + wallH - 0.1, oz + CHUNK_SIZE/2, 0.1, 0.1, CHUNK_SIZE - 0.2, corniceColor));
  
  return boxes;
}

function buildChunkMesh(boxes){
  const n = boxes.length;
  if(n === 0){
    const geo = new THREE.BufferGeometry();
    const pos = new Float32Array(0);
    geo.setAttribute('position', new THREE.BufferAttribute(pos, 3));
    return new THREE.Mesh(geo, new THREE.MeshBasicMaterial({ color: 0x000000 }));
  }
  
  const positions = new Float32Array(n * VERTS_PER_BOX * 3);
  const normals = new Float32Array(n * VERTS_PER_BOX * 3);
  const colors = new Float32Array(n * VERTS_PER_BOX * 3);
  let vOff = 0;
  
  for(let bi = 0; bi < n; bi++){
    const b = boxes[bi];
    for(let i = 0; i < VERTS_PER_BOX; i++){
      const lx = BASE_POS[i*3], ly = BASE_POS[i*3+1], lz = BASE_POS[i*3+2];
      const idx = (vOff + i) * 3;
      positions[idx] = b.x + lx * b.w;
      positions[idx+1] = b.y + ly * b.h;
      positions[idx+2] = b.z + lz * b.d;
      normals[idx] = BASE_NORM[i*3];
      normals[idx+1] = BASE_NORM[i*3+1];
      normals[idx+2] = BASE_NORM[i*3+2];
      colors[idx] = b.color.r;
      colors[idx+1] = b.color.g;
      colors[idx+2] = b.color.b;
    }
    vOff += VERTS_PER_BOX;
  }
  
  const geo = new THREE.BufferGeometry();
  geo.setAttribute('position', new THREE.BufferAttribute(positions, 3));
  geo.setAttribute('normal', new THREE.BufferAttribute(normals, 3));
  geo.setAttribute('color', new THREE.BufferAttribute(colors, 3));
  
  const mat = new THREE.MeshStandardMaterial({
    vertexColors: true,
    roughness: 0.6,
    metalness: 0.1,
    transparent: true,
    opacity: 0
  });
  
  const mesh = new THREE.Mesh(geo, mat);
  mesh.frustumCulled = true;
  mesh.userData.boxes = boxes;
  return mesh;
}

/* ---------------- STREAMING ---------------- */
const chunkGroup = new THREE.Group();
scene.add(chunkGroup);
const chunkMap = new Map();
const saltMap = new Map();
const buildingSet = new Set();

let collidablesList = [];
function rebuildCollidables(){ collidablesList = chunkGroup.children; }

function chunkKey(cx, cz, floor){ return cx+','+cz+','+floor; }
function getFloorFromY(y){ return Math.round(y / 4); }

function requestChunk(cx, cz, floor){
  const key = chunkKey(cx, cz, floor);
  if(chunkMap.has(key) || buildingSet.has(key)) return;
  buildingSet.add(key);
  
  const boxes = generateArchitecture(cx, cz, floor);
  const mesh = buildChunkMesh(boxes);
  chunkGroup.add(mesh);
  chunkMap.set(key, {cx, cz, floor, mesh, state:'in', alpha:0, scaleY:0.1});
  buildingSet.delete(key);
  rebuildCollidables();
}

function unloadChunk(key){
  const c = chunkMap.get(key);
  if(!c) return;
  chunkGroup.remove(c.mesh);
  if(c.mesh.geometry) c.mesh.geometry.dispose();
  if(c.mesh.material) c.mesh.material.dispose();
  chunkMap.delete(key);
  rebuildCollidables();
}

let loadingComplete = false;

function nearestMissingChunks(px, py, pz, radius, forwardX, forwardZ){
  const currentFloor = getFloorFromY(py);
  const floorRange = Math.ceil(radius / 4) + 1;
  const rC = Math.ceil(radius / CHUNK_SIZE);
  const pcx = Math.floor(px / CHUNK_SIZE), pcz = Math.floor(pz / CHUNK_SIZE);
  const list = [];
  
  for(let floor = currentFloor - floorRange; floor <= currentFloor + floorRange; floor++){
    const floorY = floor * 4;
    const dy = floorY - py;
    if(Math.abs(dy) > radius + 4) continue;
    
    for(let cx = pcx - rC; cx <= pcx + rC; cx++){
      for(let cz = pcz - rC; cz <= pcz + rC; cz++){
        const centerX = cx * CHUNK_SIZE + CHUNK_SIZE/2;
        const centerZ = cz * CHUNK_SIZE + CHUNK_SIZE/2;
        const dx = centerX - px;
        const dz = centerZ - pz;
        const dist = Math.hypot(dx, dy, dz);
        if(dist > radius) continue;
        
        const key = chunkKey(cx, cz, floor);
        if(chunkMap.has(key) || buildingSet.has(key)) continue;
        
        let score = dist;
        if(forwardX !== undefined && dist > 0.01){
          const dot = (dx/dist) * forwardX + (dz/dist) * forwardZ;
          score -= dot * 30;
        }
        list.push({cx, cz, floor, score});
      }
    }
  }
  list.sort((a,b) => a.score - b.score);
  return list;
}

function updateStreaming(px, py, pz, forwardX, forwardZ, budget){
  const candidates = nearestMissingChunks(px, py, pz, ACTIVE_RADIUS, forwardX, forwardZ);
  for(let i = 0; i < Math.min(budget, candidates.length); i++){
    requestChunk(candidates[i].cx, candidates[i].cz, candidates[i].floor);
  }
  
  for(const [key, c] of chunkMap){
    const centerX = c.cx * CHUNK_SIZE + CHUNK_SIZE/2;
    const centerZ = c.cz * CHUNK_SIZE + CHUNK_SIZE/2;
    const floorY = c.floor * 4;
    const dy = floorY - py;
    const dist = Math.hypot(centerX - px, centerZ - pz, dy);
    
    if(dist > UNLOAD_RADIUS && c.state !== 'out'){
      c.state = 'out';
    } else if(dist <= ACTIVE_RADIUS && c.state === 'out'){
      c.state = 'in';
    }
  }
}

function animateChunks(dt){
  for(const [key, c] of chunkMap){
    if(c.state === 'in'){
      c.alpha = Math.min(1, c.alpha + dt/FADE_TIME);
      c.mesh.scale.y = 0.1 + 0.9 * c.alpha;
      c.mesh.material.opacity = c.alpha;
      if(c.alpha >= 1) c.state = 'active';
    } else if(c.state === 'out'){
      c.alpha = Math.max(0, c.alpha - dt/FADE_TIME);
      c.mesh.scale.y = 0.1 + 0.9 * c.alpha;
      c.mesh.material.opacity = c.alpha;
      if(c.alpha <= 0) unloadChunk(key);
    }
  }
}

const player = { position: new THREE.Vector3(0, EYE_HEIGHT, 0) };
let yaw = 0, pitch = 0;
let velocityY = 0;
let grounded = true;
let running = false;
let wantsJump = false;
let fallStartY = null;

const raycaster = new THREE.Raycaster();
const _fwd = new THREE.Vector3(), _right = new THREE.Vector3();

function updateThirdPersonCamera(){
  const feet = player.position.y - EYE_HEIGHT;
  const pivot = new THREE.Vector3(player.position.x, feet + 1.2, player.position.z);
  
  const cp = Math.max(THIRD_PERSON_PITCH_MIN, Math.min(THIRD_PERSON_PITCH_MAX, pitch));
  const cosP = Math.cos(cp);
  const sinP = Math.sin(cp);
  const backX = Math.sin(yaw) * THIRD_PERSON_DISTANCE * cosP;
  const backZ = Math.cos(yaw) * THIRD_PERSON_DISTANCE * cosP;
  const upY = -sinP * THIRD_PERSON_DISTANCE + 0.8;
  
  const camPosTarget = new THREE.Vector3(pivot.x + backX, pivot.y + upY, pivot.z + backZ);
  
  let finalPos = camPosTarget;
  const dir = camPosTarget.clone().sub(pivot);
  const dist = dir.length();
  if(dist > 0.001){
    dir.normalize();
    raycaster.set(pivot, dir);
    raycaster.far = dist;
    const hits = raycaster.intersectObjects(collidablesList, false);
    if(hits.length > 0 && hits[0].distance < dist){
      const newDist = Math.max(1.0, hits[0].distance - 0.2);
      finalPos = pivot.clone().add(dir.multiplyScalar(newDist));
    }
  }
  
  camera.position.copy(finalPos);
  camera.lookAt(pivot.x, pivot.y + 0.2, pivot.z);
}

function updateFirstPersonCamera(){
  camera.position.copy(player.position);
  camera.rotation.set(pitch, yaw, 0, 'YXZ');
}

function updateCamera(){
  if(cameraMode === 'third'){
    updateThirdPersonCamera();
    playerGroup.visible = true;
    document.getElementById('crosshair').style.display = 'none';
  } else {
    updateFirstPersonCamera();
    playerGroup.visible = false;
    document.getElementById('crosshair').style.display = 'block';
  }
}

function updatePhysics(dt, inForward, inStrafe){
  const speed = WALK_SPEED * (running ? RUN_MULT : 1);
  _fwd.set(-Math.sin(yaw), 0, -Math.cos(yaw));
  _right.set(Math.cos(yaw), 0, -Math.sin(yaw));
  
  let mx = _fwd.x * inForward + _right.x * inStrafe;
  let mz = _fwd.z * inForward + _right.z * inStrafe;
  const len = Math.hypot(mx, mz);
  if(len > 1){ mx /= len; mz /= len; }
  
  let dx = mx * speed * dt;
  let dz = mz * speed * dt;
  const rayY = (player.position.y - EYE_HEIGHT) + 0.8;
  
  if(Math.abs(dx) > 1e-6){
    raycaster.set(new THREE.Vector3(player.position.x, rayY, player.position.z), new THREE.Vector3(Math.sign(dx), 0, 0));
    raycaster.far = PLAYER_RADIUS + Math.abs(dx) + 0.05;
    const hits = raycaster.intersectObjects(collidablesList, false);
    if(hits.length > 0){
      const allowed = Math.max(0, hits[0].distance - PLAYER_RADIUS - 0.02);
      dx = Math.sign(dx) * Math.min(Math.abs(dx), allowed);
    }
  }
  player.position.x += dx;
  
  if(Math.abs(dz) > 1e-6){
    raycaster.set(new THREE.Vector3(player.position.x, rayY, player.position.z), new THREE.Vector3(0, 0, Math.sign(dz)));
    raycaster.far = PLAYER_RADIUS + Math.abs(dz) + 0.05;
    const hits = raycaster.intersectObjects(collidablesList, false);
    if(hits.length > 0){
      const allowed = Math.max(0, hits[0].distance - PLAYER_RADIUS - 0.02);
      dz = Math.sign(dz) * Math.min(Math.abs(dz), allowed);
    }
  }
  player.position.z += dz;
  
  velocityY += GRAVITY * dt;
  if(velocityY < -MAX_FALL_SPEED) velocityY = -MAX_FALL_SPEED;
  if(wantsJump && grounded){
    velocityY = running ? JUMP_SPEED_RUN : JUMP_SPEED_NORMAL;
    grounded = false;
  }
  wantsJump = false;
  player.position.y += velocityY * dt;
  
  const downOrigin = new THREE.Vector3(player.position.x, (player.position.y - EYE_HEIGHT) + 1.0, player.position.z);
  raycaster.set(downOrigin, new THREE.Vector3(0, -1, 0));
  raycaster.far = Math.max(6, Math.abs(velocityY) * dt + 2);
  const groundHits = raycaster.intersectObjects(collidablesList, false);
  if(groundHits.length > 0){
    const groundY = groundHits[0].point.y;
    const currentFeet = player.position.y - EYE_HEIGHT;
    if(currentFeet <= groundY + 0.15 && velocityY <= 0){
      player.position.y = groundY + EYE_HEIGHT;
      velocityY = 0;
      grounded = true;
      fallStartY = null;
    } else if(currentFeet > groundY + 0.15){
      grounded = false;
    }
  } else {
    grounded = false;
    if(fallStartY === null) fallStartY = player.position.y;
    if(fallStartY - player.position.y > 20){
      const floor = getFloorFromY(player.position.y);
      player.position.y = floor * 4 + EYE_HEIGHT + 2;
      velocityY = 0;
      fallStartY = null;
    }
  }
  
  playerGroup.position.copy(player.position);
  playerGroup.position.y -= EYE_HEIGHT;
  playerGroup.rotation.y = yaw;
  
  updateCamera();
  
  const currentFloor = getFloorFromY(player.position.y);
  document.getElementById('hudFloor').textContent = currentFloor;
  
  // Detecta sala atual
  const roomX = Math.floor(player.position.x / 10);
  const roomZ = Math.floor(player.position.z / 10);
  document.getElementById('hudRoom').textContent = roomX + ',' + roomZ;
}

const joystickZone = document.getElementById('joystickZone');
const joystickKnob = document.getElementById('joystickKnob');
const camLookZone = document.getElementById('camLookZone');
const btnJump = document.getElementById('btnJump');
const btnRun = document.getElementById('btnRun');

let joyActive = false, joyId = null, joyVec = {x:0,y:0};
let lookId = null, lookLast = {x:0,y:0};

function joyCenter(){
  const r = joystickZone.getBoundingClientRect();
  return {x: r.left + r.width/2, y: r.top + r.height/2, radius: r.width/2};
}

joystickZone.addEventListener('touchstart', (e)=>{
  e.preventDefault();
  const t = e.changedTouches[0];
  joyActive = true; joyId = t.identifier;
  updateJoystick(t);
}, {passive:false});

joystickZone.addEventListener('touchmove', (e)=>{
  e.preventDefault();
  for(const t of e.changedTouches){
    if(t.identifier === joyId) updateJoystick(t);
  }
}, {passive:false});

function endJoy(e){
  for(const t of e.changedTouches){
    if(t.identifier === joyId){
      joyActive = false; joyId = null;
      joyVec = {x:0, y:0};
      joystickKnob.style.left = '35px';
      joystickKnob.style.top = '35px';
    }
  }
}
joystickZone.addEventListener('touchend', endJoy);
joystickZone.addEventListener('touchcancel', endJoy);

function updateJoystick(t){
  const c = joyCenter();
  let dx = t.clientX - c.x, dy = t.clientY - c.y;
  const dist = Math.hypot(dx, dy);
  const max = c.radius;
  if(dist > max){ dx = dx/dist * max; dy = dy/dist * max; }
  joyVec.x = dx/max; joyVec.y = dy/max;
  joystickKnob.style.left = (35 + dx) + 'px';
  joystickKnob.style.top = (35 + dy) + 'px';
}

camLookZone.addEventListener('touchstart', (e)=>{
  for(const t of e.changedTouches){
    if(t.identifier === joyId) continue;
    if(lookId === null){ lookId = t.identifier; lookLast = {x:t.clientX, y:t.clientY}; }
  }
}, {passive:true});

camLookZone.addEventListener('touchmove', (e)=>{
  for(const t of e.changedTouches){
    if(t.identifier !== lookId) continue;
    const dx = t.clientX - lookLast.x, dy = t.clientY - lookLast.y;
    lookLast = {x:t.clientX, y:t.clientY};
    yaw -= dx * 0.0042;
    pitch -= dy * 0.0042;
    pitch = Math.max(-Math.PI/2 + 0.02, Math.min(Math.PI/2 - 0.02, pitch));
  }
}, {passive:true});

function endLook(e){
  for(const t of e.changedTouches){
    if(t.identifier === lookId) lookId = null;
  }
}
camLookZone.addEventListener('touchend', endLook);
camLookZone.addEventListener('touchcancel', endLook);

btnJump.addEventListener('touchstart', (e)=>{ e.preventDefault(); wantsJump = true; }, {passive:false});

btnRun.addEventListener('touchstart', (e)=>{
  e.preventDefault();
  running = !running;
  btnRun.classList.toggle('active', running);
}, {passive:false});

function mobileInputVector(){
  return { f: -joyVec.y, s: joyVec.x };
}

/* ===== START ===== */
function beginGame(selectedModeArg){
  mode = selectedModeArg;
  document.getElementById('loadingScreen').style.display = 'flex';
  document.getElementById('loadingLabel').textContent = 'CARREGANDO 0%';
  document.getElementById('loadingBarInner').style.width = '0%';
  
  player.position.set(0, EYE_HEIGHT, 0);
  velocityY = 0; fallStartY = null; grounded = true;
  yaw = 0; pitch = 0;
  camera.position.copy(player.position);
  loadingComplete = false;
  started = false;
  
  createPlayer();
  playerGroup.position.copy(player.position);
  playerGroup.position.y -= EYE_HEIGHT;
  playerGroup.rotation.y = yaw;
  playerGroup.visible = true;
  cameraMode = 'third';
  document.getElementById('hudCamMode').textContent = '3ª PESSOA';
  
  chunkMap.clear();
  saltMap.clear();
  while(chunkGroup.children.length > 0){
    const child = chunkGroup.children[0];
    chunkGroup.remove(child);
    if(child.geometry) child.geometry.dispose();
    if(child.material) child.material.dispose();
  }
  rebuildCollidables();
  
  animate();
}

/* ===== LOADING ===== */
const loadingScreen = document.getElementById('loadingScreen');
const loadingLabel = document.getElementById('loadingLabel');
const loadingBarInner = document.getElementById('loadingBarInner');
const hud = document.getElementById('hud');
const crosshair = document.getElementById('crosshair');
const pcHint = document.getElementById('pcHint');
const mobileControls = document.getElementById('mobileControls');

function neededInitialChunkCount(){
  const rC = Math.ceil(INITIAL_RADIUS / CHUNK_SIZE);
  const floorRange = Math.ceil(INITIAL_RADIUS / 4) + 1;
  let n = 0;
  for(let floor = -floorRange; floor <= floorRange; floor++){
    for(let cx = -rC; cx <= rC; cx++){
      for(let cz = -rC; cz <= rC; cz++){
        const dx = cx * CHUNK_SIZE + CHUNK_SIZE/2;
        const dz = cz * CHUNK_SIZE + CHUNK_SIZE/2;
        const dy = floor * 4;
        const dist = Math.hypot(dx, dy, dz);
        if(dist <= INITIAL_RADIUS) n++;
      }
    }
  }
  return n;
}
const NEEDED_INITIAL = neededInitialChunkCount();

function initialLoadStep(){
  const list = nearestMissingChunks(0, 0, 0, INITIAL_RADIUS, 0, -1);
  const batch = Math.min(12, list.length);
  for(let i = 0; i < batch; i++){
    requestChunk(list[i].cx, list[i].cz, list[i].floor);
  }
  
  const loadedInRange = [...chunkMap.values()].filter(c => {
    const dx = c.cx * CHUNK_SIZE + CHUNK_SIZE/2;
    const dz = c.cz * CHUNK_SIZE + CHUNK_SIZE/2;
    const dy = c.floor * 4;
    return Math.hypot(dx, dy, dz) <= INITIAL_RADIUS;
  }).length;
  
  const pct = Math.min(100, Math.round((loadedInRange / NEEDED_INITIAL) * 100));
  loadingBarInner.style.width = pct + '%';
  loadingLabel.textContent = 'CARREGANDO ' + pct + '%';
  
  for(const c of chunkMap.values()){
    c.alpha = 1;
    c.mesh.material.opacity = 1;
    c.mesh.scale.y = 1;
    c.state = 'active';
  }
  
  if(loadedInRange >= NEEDED_INITIAL){
    loadingComplete = true;
    loadingScreen.style.display = 'none';
    hud.style.display = 'block';
    if(mode === 'pc'){ crosshair.style.display = 'block'; pcHint.style.display = 'block'; }
    if(mode === 'mobile'){ mobileControls.style.display = 'block'; }
    cameraMode = 'third';
    playerGroup.visible = true;
    document.getElementById('crosshair').style.display = 'none';
  }
}

let started = false;

/* ===== MAIN LOOP ===== */
const clock = new THREE.Clock();

function animate(){
  if(!started){ started = true; clock.start(); }
  requestAnimationFrame(animate);
  const dt = Math.min(clock.getDelta(), 0.06);
  
  if(!loadingComplete){
    initialLoadStep();
    renderer.render(scene, camera);
    return;
  }
  
  const inVec = mode === 'pc' ? pcInputVector() : mobileInputVector();
  
  updatePhysics(dt, inVec.f, inVec.s);
  
  _fwd.set(-Math.sin(yaw), 0, -Math.cos(yaw));
  updateStreaming(player.position.x, player.position.y, player.position.z, _fwd.x, _fwd.z, 3);
  animateChunks(dt);
  
  const pos = player.position;
  document.getElementById('hudPos').textContent = pos.x.toFixed(1) + ', ' + (pos.y - EYE_HEIGHT).toFixed(1) + ', ' + pos.z.toFixed(1);
  
  renderer.render(scene, camera);
}

animate();

})();
</script>
