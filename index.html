<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Arena de Tiro 3D</title>
    <style>
        body {
            margin: 0;
            overflow: hidden;
            font-family: Arial, Helvetica, sans-serif;
        }
        #info {
            position: absolute;
            top: 20px;
            left: 20px;
            color: white;
            font-size: 28px;
            font-weight: bold;
            text-shadow: 0 0 10px black;
            background: rgba(0, 0, 0, 0.5);
            padding: 8px 18px;
            border-radius: 8px;
            pointer-events: none;
            user-select: none;
            z-index: 10;
        }
        #crosshair {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            color: white;
            font-size: 40px;
            font-weight: bold;
            text-shadow: 0 0 5px black;
            pointer-events: none;
            user-select: none;
            z-index: 10;
            opacity: 0.8;
        }
        #blocker {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.4);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 20;
            cursor: pointer;
            color: white;
            font-size: 32px;
            font-weight: bold;
            text-shadow: 0 0 20px black;
            flex-direction: column;
        }
        #blocker small {
            font-size: 18px;
            font-weight: normal;
            margin-top: 10px;
            opacity: 0.8;
        }
        #blocker.hidden {
            display: none;
        }
    </style>
</head>
<body>

    <!-- HUD -->
    <div id="info">DANO: <span id="damageValue">0</span></div>
    <div id="crosshair">+</div>

    <!-- Bloqueio para ativar o mouse -->
    <div id="blocker">
        🎯 Clique para Jogar
        <small>WASD para andar · Mouse para mirar · Segurar esquerdo para atirar</small>
    </div>

    <!-- Three.js via CDN -->
    <script type="importmap">
        {
            "imports": {
                "three": "https://unpkg.com/three@0.160.0/build/three.module.js"
            }
        }
    </script>

    <script type="module">
        import * as THREE from 'three';

        // --- CONFIGURAÇÕES ---
        const ARENA_SIZE = 20;
        const WALL_HEIGHT = 3;
        const WALL_THICK = 0.5;
        const PLAYER_SPEED = 6;
        const FIRE_RATE = 0.12; // segundos entre tiros
        const DAMAGE_PER_HIT = 1;

        // --- ELEMENTOS DOM ---
        const blocker = document.getElementById('blocker');
        const damageSpan = document.getElementById('damageValue');

        // --- CENA, CÂMERA, RENDER ---
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x88ccff); // céu claro

        const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 100);
        camera.position.set(0, 1.7, -6); // altura dos olhos

        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.shadowMap.enabled = true; // sombras legais
        document.body.appendChild(renderer.domElement);

        // --- LUZ ---
        const ambientLight = new THREE.AmbientLight(0x404060);
        scene.add(ambientLight);

        const dirLight = new THREE.DirectionalLight(0xffffff, 1.5);
        dirLight.position.set(10, 20, 10);
        dirLight.castShadow = true;
        scene.add(dirLight);

        const fillLight = new THREE.DirectionalLight(0xccddff, 0.5);
        fillLight.position.set(-10, 5, -10);
        scene.add(fillLight);

        // --- 1. ARENA (chão + muros) ---

        // Chão
        const floorGeo = new THREE.PlaneGeometry(ARENA_SIZE, ARENA_SIZE);
        const floorMat = new THREE.MeshStandardMaterial({ color: 0x777777, roughness: 0.8 });
        const floor = new THREE.Mesh(floorGeo, floorMat);
        floor.rotation.x = -Math.PI / 2;
        floor.position.y = 0;
        floor.receiveShadow = true;
        scene.add(floor);

        // Função para criar muro com colisão (bounding box)
        function createWall(w, h, d, x, y, z, color = 0x4a6b8a) {
            const geo = new THREE.BoxGeometry(w, h, d);
            const mat = new THREE.MeshStandardMaterial({ color, roughness: 0.5 });
            const mesh = new THREE.Mesh(geo, mat);
            mesh.position.set(x, y, z);
            mesh.castShadow = true;
            mesh.receiveShadow = true;
            scene.add(mesh);
            // Guardar para colisão
            return { min: { x: x - w / 2, z: z - d / 2 }, max: { x: x + w / 2, z: z + d / 2 } };
        }

        const walls = [];
        const half = ARENA_SIZE / 2;
        // Muro Norte (Z+)
        walls.push(createWall(ARENA_SIZE, WALL_HEIGHT, WALL_THICK, 0, WALL_HEIGHT / 2, half));
        // Muro Sul (Z-)
        walls.push(createWall(ARENA_SIZE, WALL_HEIGHT, WALL_THICK, 0, WALL_HEIGHT / 2, -half));
        // Muro Leste (X+)
        walls.push(createWall(WALL_THICK, WALL_HEIGHT, ARENA_SIZE, half, WALL_HEIGHT / 2, 0));
        // Muro Oeste (X-)
        walls.push(createWall(WALL_THICK, WALL_HEIGHT, ARENA_SIZE, -half, WALL_HEIGHT / 2, 0));

        // --- 2. BONECO-ALVO ---
        const targetGroup = new THREE.Group();
        targetGroup.position.set(0, 0, 0);

        // Tronco
        const bodyMat = new THREE.MeshStandardMaterial({ color: 0xff4444 });
        const body = new THREE.Mesh(new THREE.BoxGeometry(0.6, 0.8, 0.4), bodyMat);
        body.position.y = 0.9;
        body.castShadow = true;
        targetGroup.add(body);

        // Cabeça
        const headMat = new THREE.MeshStandardMaterial({ color: 0xffccaa });
        const head = new THREE.Mesh(new THREE.SphereGeometry(0.25, 8, 8), headMat);
        head.position.y = 1.5;
        head.castShadow = true;
        targetGroup.add(head);

        // Braços (simples)
        const armMat = new THREE.MeshStandardMaterial({ color: 0xffaa88 });
        const armGeo = new THREE.CylinderGeometry(0.07, 0.07, 0.6);
        // Braço esquerdo
        const armL = new THREE.Mesh(armGeo, armMat);
        armL.position.set(-0.45, 0.95, 0);
        armL.rotation.z = 0.2;
        armL.castShadow = true;
        targetGroup.add(armL);
        // Braço direito
        const armR = new THREE.Mesh(armGeo, armMat);
        armR.position.set(0.45, 0.95, 0);
        armR.rotation.z = -0.2;
        armR.castShadow = true;
        targetGroup.add(armR);

        // Pernas
        const legMat = new THREE.MeshStandardMaterial({ color: 0x224466 });
        const legGeo = new THREE.CylinderGeometry(0.08, 0.08, 0.5);
        const legL = new THREE.Mesh(legGeo, legMat);
        legL.position.set(-0.2, 0.35, 0);
        legL.castShadow = true;
        targetGroup.add(legL);
        const legR = new THREE.Mesh(legGeo, legMat);
        legR.position.set(0.2, 0.35, 0);
        legR.castShadow = true;
        targetGroup.add(legR);

        scene.add(targetGroup);

        // Collider do boneco (para detecção de raycast)
        const targetCollider = new THREE.Mesh(
            new THREE.BoxGeometry(0.8, 1.8, 0.6),
            new THREE.MeshBasicMaterial({ visible: false, transparent: true, opacity: 0 })
        );
        targetCollider.position.copy(targetGroup.position);
        targetCollider.position.y = 0.9;
        scene.add(targetCollider);

        // --- ESTADO DO JOGADOR ---
        const player = {
            position: new THREE.Vector3(0, 1.7, -6),
            yaw: 0,
            pitch: 0,
            speed: PLAYER_SPEED
        };
        camera.position.copy(player.position);

        // Teclas pressionadas
        const keys = { w: false, a: false, s: false, d: false };

        // --- ARMA (visual) ---
        const gunGroup = new THREE.Group();
        // Cano
        const gunMat = new THREE.MeshStandardMaterial({ color: 0x333333, metalness: 0.6, roughness: 0.4 });
        const barrel = new THREE.Mesh(new THREE.CylinderGeometry(0.04, 0.06, 0.35), gunMat);
        barrel.rotation.x = Math.PI / 2;
        barrel.position.set(0, 0, -0.2);
        gunGroup.add(barrel);
        // Corpo da arma
        const bodyGun = new THREE.Mesh(new THREE.BoxGeometry(0.08, 0.15, 0.25), gunMat);
        bodyGun.position.set(0, -0.02, 0.1);
        gunGroup.add(bodyGun);
        // Empunhadura
        const gripMat = new THREE.MeshStandardMaterial({ color: 0x2a1a0a });
        const grip = new THREE.Mesh(new THREE.BoxGeometry(0.06, 0.15, 0.06), gripMat);
        grip.position.set(0, -0.12, 0.15);
        gunGroup.add(grip);

        gunGroup.position.set(0.3, -0.15, -0.4);
        scene.add(gunGroup); // Vai acompanhar a câmera manualmente

        // --- ESTADO DO TIRO ---
        let isFiring = false;
        let fireTimeout = null;
        let damageCount = 0;

        // Raycaster
        const raycaster = new THREE.Raycaster();

        // --- FUNÇÃO DE TIRO ---
        function shoot() {
            if (!isFiring) return;

            // Raycast do centro da câmera
            raycaster.setFromCamera({ x: 0, y: 0 }, camera);
            const intersects = raycaster.intersectObject(targetCollider);

            if (intersects.length > 0) {
                // Acertou o boneco!
                damageCount += DAMAGE_PER_HIT;
                damageSpan.textContent = damageCount;

                // Feedback visual: piscar o boneco
                body.material.color.setHex(0xffaa00);
                head.material.color.setHex(0xffaa00);
                setTimeout(() => {
                    body.material.color.setHex(0xff4444);
                    head.material.color.setHex(0xffccaa);
                }, 80);

                // Pequeno efeito de "impacto" (partícula simples)
                const impact = new THREE.Mesh(
                    new THREE.SphereGeometry(0.04, 4, 4),
                    new THREE.MeshBasicMaterial({ color: 0xffaa00 })
                );
                const point = intersects[0].point;
                impact.position.copy(point);
                scene.add(impact);
                setTimeout(() => scene.remove(impact), 150);
            }

            // Disparo contínuo com cadência
            if (isFiring) {
                fireTimeout = setTimeout(shoot, FIRE_RATE * 1000);
            }
        }

        // --- CONTROLES DE MOUSE (Pointer Lock) ---
        document.addEventListener('mousemove', (event) => {
            if (document.pointerLockElement !== renderer.domElement) return;

            const sensitivity = 0.002;
            player.yaw -= event.movementX * sensitivity;
            player.pitch -= event.movementY * sensitivity;
            player.pitch = Math.max(-1.2, Math.min(1.2, player.pitch)); // limite vertical

            camera.rotation.order = 'YXZ';
            camera.rotation.y = player.yaw;
            camera.rotation.x = player.pitch;
        });

        // --- CLIQUE PARA TRAVAR O MOUSE ---
        blocker.addEventListener('click', () => {
            renderer.domElement.requestPointerLock();
        });

        document.addEventListener('pointerlockchange', () => {
            if (document.pointerLockElement === renderer.domElement) {
                blocker.classList.add('hidden');
            } else {
                blocker.classList.remove('hidden');
                // Para de atirar se perder o foco
                if (isFiring) {
                    isFiring = false;
                    if (fireTimeout) clearTimeout(fireTimeout);
                }
            }
        });

        // --- BOTÃO ESQUERDO DO MOUSE (TIRO CONTÍNUO) ---
        renderer.domElement.addEventListener('mousedown', (e) => {
            if (e.button === 0 && document.pointerLockElement === renderer.domElement) {
                e.preventDefault();
                if (!isFiring) {
                    isFiring = true;
                    shoot(); // primeiro tiro imediato
                }
            }
        });

        renderer.domElement.addEventListener('mouseup', (e) => {
            if (e.button === 0) {
                isFiring = false;
                if (fireTimeout) {
                    clearTimeout(fireTimeout);
                    fireTimeout = null;
                }
            }
        });

        // Previne o menu de contexto (botão direito)
        renderer.domElement.addEventListener('contextmenu', (e) => e.preventDefault());

        // --- TECLAS (WASD) ---
        document.addEventListener('keydown', (e) => {
            switch (e.code) {
                case 'KeyW': keys.w = true; e.preventDefault(); break;
                case 'KeyA': keys.a = true; e.preventDefault(); break;
                case 'KeyS': keys.s = true; e.preventDefault(); break;
                case 'KeyD': keys.d = true; e.preventDefault(); break;
            }
        });
        document.addEventListener('keyup', (e) => {
            switch (e.code) {
                case 'KeyW': keys.w = false; e.preventDefault(); break;
                case 'KeyA': keys.a = false; e.preventDefault(); break;
                case 'KeyS': keys.s = false; e.preventDefault(); break;
                case 'KeyD': keys.d = false; e.preventDefault(); break;
            }
        });

        // --- COLISÃO COM MUROS ---
        function clampPosition(pos) {
            const margin = 0.4; // raio do jogador
            const halfSize = ARENA_SIZE / 2 - margin;
            // Limitar X e Z dentro dos muros
            if (pos.x > halfSize) pos.x = halfSize;
            if (pos.x < -halfSize) pos.x = -halfSize;
            if (pos.z > halfSize) pos.z = halfSize;
            if (pos.z < -halfSize) pos.z = -halfSize;
            return pos;
        }

        // --- LOOP DO JOGO (movimento e render) ---
        function animate() {
            // Movimento (WASD)
            if (document.pointerLockElement === renderer.domElement) {
                const forward = new THREE.Vector3(0, 0, -1).applyQuaternion(camera.quaternion);
                forward.y = 0;
                forward.normalize();

                const right = new THREE.Vector3(1, 0, 0).applyQuaternion(camera.quaternion);
                right.y = 0;
                right.normalize();

                const moveDelta = new THREE.Vector3(0, 0, 0);
                if (keys.w) moveDelta.add(forward);
                if (keys.s) moveDelta.sub(forward);
                if (keys.d) moveDelta.add(right);
                if (keys.a) moveDelta.sub(right);

                if (moveDelta.lengthSq() > 0) {
                    moveDelta.normalize().multiplyScalar(player.speed * 0.016); // deltaTime aproximado
                    const newPos = player.position.clone().add(moveDelta);
                    // Aplica colisão com muros
                    const clamped = clampPosition(newPos);
                    player.position.copy(clamped);
                    camera.position.copy(clamped);
                }
            }

            // Arma acompanha a câmera com pequeno "bounce"
            gunGroup.position.copy(camera.position);
            gunGroup.position.add(new THREE.Vector3(0.3, -0.15, -0.4));
            gunGroup.rotation.copy(camera.rotation);

            renderer.render(scene, camera);
            requestAnimationFrame(animate);
        }

        animate();

        // --- REDIMENSIONAR TELA ---
        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });

        console.log('🎯 Jogo iniciado! Clique na tela para travar o mouse.');
    </script>
</body>
</html>
