<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>Ideal Place for Families</title>
<style>
  :root{
    --gray-950:#0c0d0f;
    --gray-900:#141518;
    --gray-800:#202226;
    --gray-700:#33363b;
    --gray-500:#6b6f76;
    --gray-300:#a8acb3;
    --gray-100:#e4e6e9;
    --accent:#c0392b;
    --font-ui: 'Consolas','Courier New',monospace;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent; user-select:none;}
  html,body{margin:0;padding:0;width:100%;height:100%;overflow:hidden;background:#0c0d0f;font-family:var(--font-ui);}
  #renderCanvas{position:absolute;top:0;left:0;width:100%;height:100%;display:block;outline:none;}

  /* ===== TELA INICIAL ORIGINAL ===== */
  #startScreen{
    position:absolute;inset:0;z-index:50;
    display:flex;flex-direction:column;align-items:center;justify-content:center;
    background: #0c0d0f;
    padding:20px;
  }
  #startScreen::before{
    content:'';
    position:absolute;inset:0;
    background:
      radial-gradient(ellipse at 30% 40%, rgba(192,57,43,0.08) 0%, transparent 60%),
      radial-gradient(ellipse at 70% 60%, rgba(139,115,85,0.05) 0%, transparent 50%);
    pointer-events:none;
  }
  #startLogo{
    position:relative;
    z-index:1;
    text-align:center;
    margin-bottom:40px;
  }
  #startLogo .icon{
    font-size:clamp(48px,10vw,96px);
    display:block;
    margin-bottom:8px;
    animation: float 3s ease-in-out infinite;
  }
  @keyframes float{
    0%,100%{transform:translateY(0px);}
    50%{transform:translateY(-12px);}
  }
  #startLogo h1{
    font-family:var(--font-ui);
    font-weight:700;
    letter-spacing:8px;
    font-size:clamp(22px,5vw,48px);
    color:#e8ddd0;
    text-transform:uppercase;
    margin:0;
    text-shadow:0 0 40px rgba(192,57,43,0.15);
  }
  #startLogo .sub{
    font-family:var(--font-ui);
    letter-spacing:12px;
    font-size:clamp(9px,1.2vw,14px);
    color:var(--gray-500);
    text-transform:uppercase;
    margin-top:6px;
    border-top:1px solid var(--gray-700);
    padding-top:10px;
  }
  #startLogo .tagline{
    font-family:var(--font-ui);
    letter-spacing:4px;
    font-size:clamp(10px,1vw,13px);
    color:var(--gray-500);
    margin-top:10px;
    opacity:0.6;
  }
  #platformRow{
    position:relative;
    z-index:1;
    display:flex;
    gap:24px;
    flex-wrap:wrap;
    justify-content:center;
  }
  .platBtn{
    font-family:var(--font-ui);
    letter-spacing:3px;
    font-size:14px;
    padding:14px 38px;
    color:var(--gray-100);
    background:transparent;
    border:1.5px solid var(--gray-700);
    cursor:pointer;
    text-transform:uppercase;
    transition:all .25s;
    position:relative;
    overflow:hidden;
  }
  .platBtn::after{
    content:'';
    position:absolute;
    inset:0;
    background:#c0392b;
    transform:translateX(-100%);
    transition:transform .3s;
    z-index:-1;
  }
  .platBtn:hover::after{transform:translateX(0);}
  .platBtn:hover{border-color:#c0392b;color:#fff;}
  .platBtn:active{transform:scale(0.95);}
  .platBtn .key{
    display:inline-block;
    background:var(--gray-800);
    padding:0 8px;
    border-radius:2px;
    font-size:10px;
    margin-left:6px;
    color:var(--gray-500);
  }

  #loadingScreen{
    position:absolute;inset:0;z-index:40;
    display:none;flex-direction:column;align-items:center;justify-content:center;gap:18px;
    background:var(--gray-950);
  }
  #loadingLabel{color:var(--gray-300);letter-spacing:5px;font-size:12px;text-transform:uppercase;}
  #loadingBarOuter{width:min(420px,70vw);height:4px;background:var(--gray-800);border:1px solid var(--gray-700);}
  #loadingBarInner{width:0%;height:100%;background:#c0392b;transition:width .15s linear;}

  #hud{
    position:absolute;top:14px;left:16px;z-index:20;
    color:var(--gray-100);font-family:var(--font-ui);font-size:12px;letter-spacing:1px;
    text-shadow:0 1px 6px rgba(0,0,0,0.95);
    display:none;line-height:1.6;pointer-events:none;
  }
  #hud .lbl{color:var(--gray-500);}
  #hudPos{color:#c0392b;}
  #hudFloor{color:#c0392b;font-weight:bold;}
  #hudRoom{color:var(--gray-300);}

  #crosshair{
    position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);
    width:4px;height:4px;border-radius:50%;background:rgba(230,230,230,0.6);
    z-index:20;display:block;pointer-events:none;
  }
  #crosshair::before{
    content:'';position:absolute;top:-6px;left:50%;transform:translateX(-50%);
    width:1px;height:6px;background:rgba(230,230,230,0.3);
  }
  #crosshair::after{
    content:'';position:absolute;bottom:-6px;left:50%;transform:translateX(-50%);
    width:1px;height:6px;background:rgba(230,230,230,0.3);
  }

  #pcHint{
    position:absolute;bottom:14px;left:50%;transform:translateX(-50%);
    z-index:20;color:var(--gray-500);
    font-family:var(--font-ui);font-size:10px;letter-spacing:2px;
    display:none;pointer-events:none;
    text-shadow:0 1px 6px rgba(0,0,0,0.9);
    text-transform:uppercase;
  }

  #mobileControls{
    position:absolute;inset:0;z-index:20;
    display:none;
    pointer-events:none;
  }
  #mobileControls > * { pointer-events:auto; }

  #joystickZone{
    position:absolute;left:20px;bottom:20px;width:110px;height:110px;
    border-radius:50%;
    background:rgba(255,255,255,0.04);
    border:1.5px solid rgba(255,255,255,0.08);
    backdrop-filter:blur(6px);
    touch-action:none;
  }
  #joystickKnob{
    position:absolute;left:30px;top:30px;width:50px;height:50px;border-radius:50%;
    background:radial-gradient(circle, rgba(255,255,255,0.15), rgba(255,255,255,0.02));
    border:1.5px solid rgba(255,255,255,0.1);
    pointer-events:none;
  }
  .mobileBtn{
    border-radius:50%;
    background:rgba(255,255,255,0.04);
    border:1.5px solid rgba(255,255,255,0.08);
    backdrop-filter:blur(6px);
    color:var(--gray-100);
    font-family:var(--font-ui);
    font-size:9px;
    letter-spacing:1px;
    display:flex;
    align-items:center;
    justify-content:center;
    touch-action:none;
    transition:all 0.15s;
    text-shadow:0 1px 4px rgba(0,0,0,0.5);
    width:60px;height:60px;
  }
  .mobileBtn:active{transform:scale(0.92);background:rgba(192,57,43,0.3);}
  .mobileBtn.active{background:rgba(192,57,43,0.4);border-color:#c0392b;}

  #btnJump{position:absolute;right:20px;bottom:110px;width:68px;height:68px;font-size:10px;}
  #btnRun{position:absolute;right:20px;bottom:20px;width:56px;height:56px;font-size:8px;}
  #btnRun.active{background:rgba(192,57,43,0.4);border-color:#c0392b;}

  #camLookZone{
    position:absolute;inset:0;
    touch-action:none;
    pointer-events:auto;
  }

  #toastMsg{
    position:absolute;top:100px;left:50%;transform:translateX(-50%);
    color:var(--gray-100);font-family:var(--font-ui);font-size:11px;letter-spacing:2px;
    text-shadow:0 1px 6px rgba(0,0,0,0.9);z-index:22;opacity:0;transition:opacity .3s;
    pointer-events:none;text-transform:uppercase;
  }
</style>
</head>
<body>

<canvas id="renderCanvas"></canvas>

<!-- ===== TELA INICIAL ===== -->
<div id="startScreen">
  <div id="startLogo">
    <span class="icon">🏠</span>
    <h1>Ideal Place</h1>
    <div class="sub">for Families</div>
    <div class="tagline">✦ explore infinite architecture ✦</div>
  </div>
  <div id="platformRow">
    <button class="platBtn" id="btnPC">⌨️ PC <span class="key">WASD</span></button>
    <button class="platBtn" id="btnMobile">📱 MOBILE <span class="key">TOUCH</span></button>
  </div>
</div>

<div id="loadingScreen">
  <div id="loadingLabel">CARREGANDO 0%</div>
  <div id="loadingBarOuter"><div id="loadingBarInner"></div></div>
</div>

<div id="hud">
  <div><span class="lbl">📍</span> <span id="hudPos">0.0, 0.0, 0.0</span></div>
  <div><span class="lbl">🏢</span> Andar <span id="hudFloor">0</span></div>
  <div><span class="lbl">🚪</span> Sala <span id="hudRoom">---</span></div>
</div>
<div id="crosshair"></div>
<div id="pcHint">WASD · ESPAÇO · Q corre</div>
<div id="toastMsg"></div>

<div id="mobileControls">
  <div id="camLookZone"></div>
  <div id="joystickZone"><div id="joystickKnob"></div></div>
  <button class="mobileBtn" id="btnJump">⬆<br>PULAR</button>
  <button class="mobileBtn" id="btnRun">🏃<br>CORRER</button>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
(function(){
"use strict";

/* ======================================================================
   IDEAL PLACE FOR FAMILIES - VERSÃO OTIMIZADA
   ====================================================================== */

/* ===== MENU ===== */
let selectedMode = null;

document.getElementById('btnPC').addEventListener('click', ()=>{
  selectedMode = 'pc';
  document.getElementById('startScreen').style.display = 'none';
  beginGame(selectedMode);
});
document.getElementById('btnMobile').addEventListener('click', ()=>{
  selectedMode = 'mobile';
  document.getElementById('startScreen').style.display = 'none';
  beginGame(selectedMode);
});

/* ---------------- CONFIG OTIMIZADA ---------------- */
let CHUNK_SIZE = 32;
let ACTIVE_RADIUS = 300;
let UNLOAD_MARGIN = 30;
let UNLOAD_RADIUS = ACTIVE_RADIUS + UNLOAD_MARGIN;
let INITIAL_RADIUS = 80;
let FADE_TIME = 0.4;

const WALK_SPEED   = 3.5;
const RUN_MULT     = 4.5;

const EYE_HEIGHT   = 1.6;
const PLAYER_RADIUS = 0.25;
const GRAVITY      = -20;
const JUMP_SPEED_NORMAL = Math.sqrt(2 * Math.abs(GRAVITY) * 1.6);
const JUMP_SPEED_RUN    = Math.sqrt(2 * Math.abs(GRAVITY) * 4.5);
const MAX_FALL_SPEED = 45;

/* ---------------- THREE SETUP (ULTRA OTIMIZADO) ---------------- */
const canvas = document.getElementById('renderCanvas');
const renderer = new THREE.WebGLRenderer({
  canvas,
  antialias: false,
  powerPreference: "high-performance",
  stencil: false,
  depth: true,
  alpha: false
});
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 1));
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.outputEncoding = THREE.sRGBEncoding;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 0.85;
renderer.shadowMap.enabled = false;

const isMobile = window.innerWidth < 768;
const FOV = isMobile ? 72 : 78;
const camera = new THREE.PerspectiveCamera(FOV, window.innerWidth/window.innerHeight, 0.1, 8000);
camera.rotation.order = 'YXZ';

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x14151a);
scene.fog = new THREE.Fog(0x14151a, 40, ACTIVE_RADIUS + 20);

const ambientLight = new THREE.AmbientLight(0x8899aa, 0.5);
scene.add(ambientLight);
const sunLight = new THREE.DirectionalLight(0xffeedd, 0.6);
sunLight.position.set(80, 120, 60);
scene.add(sunLight);

function onResize(){
  const w = window.innerWidth, h = window.innerHeight;
  camera.aspect = w/h;
  camera.fov = (w < 768) ? 72 : 78;
  camera.updateProjectionMatrix();
  renderer.setSize(w, h);
}
window.addEventListener('resize', onResize);
onResize();

/* ===== PERSONAGEM ===== */
const playerGroup = new THREE.Group();
scene.add(playerGroup);
function createPlayer(){
  while(playerGroup.children.length > 0){
    const child = playerGroup.children[0];
    playerGroup.remove(child);
    child.traverse(o=>{ if(o.geometry) o.geometry.dispose(); if(o.material) o.material.dispose(); });
  }
  const dummy = new THREE.Mesh(
    new THREE.BoxGeometry(0.1, 0.1, 0.1),
    new THREE.MeshBasicMaterial({ visible: false })
  );
  playerGroup.add(dummy);
  playerGroup.visible = true;
}

/* ===== CORES ===== */
const C = {
  parede: 0xcc3333,
  pilar: 0xcc3333,
  teto: 0x8B7355,
  chao: 0x6B5340,
  porta: 0x8B7355,
  escada: 0x8B7355,
  borda: 0xeeeeee,
  corrimao: 0xeeeeee,
  moldura: 0xdddddd,
  vidro: 0x88ccdd,
};

/* ===== GEOMETRIA SIMPLIFICADA ===== */
const UNIT_BOX = new THREE.BoxGeometry(1,1,1).toNonIndexed();
const BASE_POS = UNIT_BOX.attributes.position.array;
const BASE_NORM = UNIT_BOX.attributes.normal.array;
const VERTS_PER_BOX = BASE_POS.length/3;

function box(x,y,z,w,h,d,color){
  return {x,y,z,w,h,d,color: new THREE.Color(color)};
}

function hashSeed(cx, cz, cy, salt){
  let h = 2166136261;
  h = Math.imul(h ^ (cx|0), 16777619);
  h = Math.imul(h ^ (cz|0), 16777619);
  h = Math.imul(h ^ (cy|0), 16777619);
  h = Math.imul(h ^ (salt|0), 16777619);
  h = Math.imul(h ^ 0x9e3779b9, 16777619);
  return h>>>0;
}

function mulberry32(a){
  return function(){
    a |= 0; a = (a + 0x6D2B79F5) | 0;
    let t = Math.imul(a ^ (a>>>15), 1 | a);
    t = (t + Math.imul(t ^ (t>>>7), 61 | t)) ^ t;
    return ((t ^ (t>>>14))>>>0) / 4294967296;
  };
}

function addWall(boxes, x, y, z, w, h, d, hasDoor, doorW, doorH, hasWindow, windowW, windowH){
  const wallColor = C.parede;
  const borderColor = C.borda;
  const glassColor = C.vidro;
  const doorColor = C.porta;
  
  if(!hasDoor && !hasWindow){
    boxes.push(box(x, y, z, w, h, d, wallColor));
    // Apenas bordas superiores e inferiores para economizar
    boxes.push(box(x, y + h/2 - 0.025, z, w, 0.04, d, borderColor));
    boxes.push(box(x, y - h/2 + 0.025, z, w, 0.04, d, borderColor));
    return;
  }
  
  if(hasDoor){
    const doorX = x, doorY = y - h/2 + doorH/2;
    const sideW = (w - doorW) / 2;
    if(sideW > 0.1){
      boxes.push(box(x - (w/2 - sideW/2), y, z, sideW, h, d, wallColor));
      boxes.push(box(x + (w/2 - sideW/2), y, z, sideW, h, d, wallColor));
    }
    boxes.push(box(x, y + doorH/2 + (h - doorH)/4, z, doorW, (h - doorH)/2, d, wallColor));
    boxes.push(box(doorX, doorY, z + 0.04, doorW, doorH, 0.04, doorColor));
    // Moldura simplificada
    boxes.push(box(doorX, doorY + doorH/2 + 0.03, z + 0.06, doorW + 0.08, 0.04, 0.04, C.moldura));
    boxes.push(box(doorX, doorY - doorH/2 - 0.03, z + 0.06, doorW + 0.08, 0.04, 0.04, C.moldura));
    return;
  }
  
  if(hasWindow){
    const winX = x, winY = y - h/2 + windowH/2 + 0.5;
    const sideW = (w - windowW) / 2;
    const sideH = (h - windowH) / 2;
    if(sideW > 0.1){
      boxes.push(box(x - (w/2 - sideW/2), y, z, sideW, h, d, wallColor));
      boxes.push(box(x + (w/2 - sideW/2), y, z, sideW, h, d, wallColor));
    }
    if(sideH > 0.1){
      boxes.push(box(x, y + windowH/2 + sideH/2, z, windowW, sideH, d, wallColor));
      boxes.push(box(x, y - windowH/2 - sideH/2, z, windowW, sideH, d, wallColor));
    }
    boxes.push(box(winX, winY, z + 0.04, windowW, windowH, 0.025, glassColor));
    boxes.push(box(winX, winY + windowH/2 + 0.025, z + 0.05, windowW + 0.08, 0.03, 0.03, C.moldura));
    boxes.push(box(winX, winY - windowH/2 - 0.025, z + 0.05, windowW + 0.08, 0.03, 0.03, C.moldura));
    // Cruz simplificada
    boxes.push(box(winX, winY, z + 0.045, 0.02, windowH * 0.7, 0.02, C.moldura));
    boxes.push(box(winX, winY, z + 0.045, windowW * 0.7, 0.02, 0.02, C.moldura));
    return;
  }
}

function generateArchitecture(cx, cz, floor){
  const rng = mulberry32(hashSeed(cx, cz, floor, 0xABCD));
  const boxes = [];
  const ox = cx * CHUNK_SIZE;
  const oz = cz * CHUNK_SIZE;
  const yBase = floor * 4;
  const wallH = 3.3;
  
  // Chão e teto (sempre presentes)
  boxes.push(box(ox + CHUNK_SIZE/2, yBase, oz + CHUNK_SIZE/2, CHUNK_SIZE, 0.12, CHUNK_SIZE, C.chao));
  boxes.push(box(ox + CHUNK_SIZE/2, yBase + 4, oz + CHUNK_SIZE/2, CHUNK_SIZE, 0.12, CHUNK_SIZE, C.teto));
  
  // Grid de salas (3x3 para simplificar e otimizar)
  const gridSize = 3;
  const roomSize = CHUNK_SIZE / gridSize;
  
  // Decidir conexões (simplificado)
  const connections = [];
  for(let i = 0; i < gridSize; i++){
    for(let j = 0; j < gridSize; j++){
      if(j < gridSize - 1 && rng() < 0.4) connections.push({x1:i, z1:j, x2:i, z2:j+1});
      if(i < gridSize - 1 && rng() < 0.4) connections.push({x1:i, z1:j, x2:i+1, z2:j});
    }
  }
  
  // Construir paredes
  for(let i = 0; i < gridSize; i++){
    for(let j = 0; j < gridSize; j++){
      const rx = ox + i * roomSize + roomSize/2;
      const rz = oz + j * roomSize + roomSize/2;
      
      // Parede Norte
      if(j === 0){
        const hasDoor = rng() < 0.15;
        const hasWindow = rng() < 0.25;
        addWall(boxes, rx, yBase + wallH/2, oz, roomSize, wallH, 0.12, hasDoor, 0.7, 2.0, hasWindow, 0.5, 0.7);
      } else {
        const isConnected = connections.some(c => 
          (c.x1 === i && c.z1 === j-1 && c.x2 === i && c.z2 === j) ||
          (c.x2 === i && c.z2 === j-1 && c.x1 === i && c.z1 === j)
        );
        const hasDoor = isConnected && rng() < 0.5;
        const hasWindow = !hasDoor && rng() < 0.2;
        addWall(boxes, rx, yBase + wallH/2, oz + j * roomSize, roomSize, wallH, 0.12, hasDoor, 0.7, 2.0, hasWindow, 0.5, 0.7);
      }
      
      // Parede Sul
      if(j === gridSize - 1){
        const hasDoor = rng() < 0.15;
        const hasWindow = rng() < 0.25;
        addWall(boxes, rx, yBase + wallH/2, oz + roomSize * gridSize, roomSize, wallH, 0.12, hasDoor, 0.7, 2.0, hasWindow, 0.5, 0.7);
      } else {
        const isConnected = connections.some(c => 
          (c.x1 === i && c.z1 === j && c.x2 === i && c.z2 === j+1) ||
          (c.x2 === i && c.z2 === j && c.x1 === i && c.z1 === j+1)
        );
        const hasDoor = isConnected && rng() < 0.5;
        const hasWindow = !hasDoor && rng() < 0.2;
        addWall(boxes, rx, yBase + wallH/2, oz + (j+1) * roomSize, roomSize, wallH, 0.12, hasDoor, 0.7, 2.0, hasWindow, 0.5, 0.7);
      }
      
      // Parede Oeste
      if(i === 0){
        const hasDoor = rng() < 0.15;
        const hasWindow = rng() < 0.25;
        addWall(boxes, ox, yBase + wallH/2, rz, 0.12, wallH, roomSize, hasDoor, 0.7, 2.0, hasWindow, 0.5, 0.7);
      } else {
        const isConnected = connections.some(c => 
          (c.x1 === i-1 && c.z1 === j && c.x2 === i && c.z2 === j) ||
          (c.x2 === i-1 && c.z2 === j && c.x1 === i && c.z1 === j)
        );
        const hasDoor = isConnected && rng() < 0.5;
        const hasWindow = !hasDoor && rng() < 0.2;
        addWall(boxes, ox + i * roomSize, yBase + wallH/2, rz, 0.12, wallH, roomSize, hasDoor, 0.7, 2.0, hasWindow, 0.5, 0.7);
      }
      
      // Parede Leste
      if(i === gridSize - 1){
        const hasDoor = rng() < 0.15;
        const hasWindow = rng() < 0.25;
        addWall(boxes, ox + roomSize * gridSize, yBase + wallH/2, rz, 0.12, wallH, roomSize, hasDoor, 0.7, 2.0, hasWindow, 0.5, 0.7);
      } else {
        const isConnected = connections.some(c => 
          (c.x1 === i && c.z1 === j && c.x2 === i+1 && c.z2 === j) ||
          (c.x2 === i && c.z2 === j && c.x1 === i+1 && c.z1 === j)
        );
        const hasDoor = isConnected && rng() < 0.5;
        const hasWindow = !hasDoor && rng() < 0.2;
        addWall(boxes, ox + (i+1) * roomSize, yBase + wallH/2, rz, 0.12, wallH, roomSize, hasDoor, 0.7, 2.0, hasWindow, 0.5, 0.7);
      }
    }
  }
  
  // Pilares (poucos para otimizar)
  if(rng() < 0.3){
    const px = ox + 2 + rng() * (CHUNK_SIZE - 4);
    const pz = oz + 2 + rng() * (CHUNK_SIZE - 4);
    const pSize = 0.25 + rng() * 0.2;
    boxes.push(box(px, yBase + wallH/2, pz, pSize, wallH, pSize, C.pilar));
    boxes.push(box(px, yBase + 0.08, pz, pSize * 1.3, 0.08, pSize * 1.3, C.borda));
  }
  
  // Escadarias (raras para otimizar)
  if(rng() < 0.12){
    const stairX = ox + 2 + rng() * (CHUNK_SIZE - 6);
    const stairZ = oz + 2 + rng() * (CHUNK_SIZE - 6);
    const numSteps = 5 + Math.floor(rng() * 4);
    const stepW = 1.0, stepD = 0.35, stepH = 0.25;
    
    for(let i = 0; i < numSteps; i++){
      const sy = yBase + i * stepH;
      const sx = stairX + i * stepD;
      boxes.push(box(sx + stepD/2, sy + stepH/2, stairZ, stepD, stepH, stepW, C.escada));
      if(i % 2 === 0){
        boxes.push(box(sx + stepD/2, sy + stepH, stairZ, stepD, 0.02, stepW, C.borda));
      }
      if(i % 3 === 0){
        boxes.push(box(sx + stepD/2, sy + 0.8, stairZ - stepW/2 - 0.08, stepD * 0.5, 0.03, 0.03, C.corrimao));
        boxes.push(box(sx + stepD/2, sy + 0.8, stairZ + stepW/2 + 0.08, stepD * 0.5, 0.03, 0.03, C.corrimao));
      }
    }
    const topY = yBase + numSteps * stepH;
    boxes.push(box(stairX + numSteps * stepD + 0.8, topY + 0.04, stairZ, 1.2, 0.08, stepW + 0.8, C.chao));
  }
  
  // Rodapé simplificado
  const rb = C.borda;
  boxes.push(box(ox + CHUNK_SIZE/2, yBase + 0.06, oz + 0.04, CHUNK_SIZE, 0.03, 0.03, rb));
  boxes.push(box(ox + CHUNK_SIZE/2, yBase + 0.06, oz + CHUNK_SIZE - 0.04, CHUNK_SIZE, 0.03, 0.03, rb));
  boxes.push(box(ox + 0.04, yBase + 0.06, oz + CHUNK_SIZE/2, 0.03, 0.03, CHUNK_SIZE, rb));
  boxes.push(box(ox + CHUNK_SIZE - 0.04, yBase + 0.06, oz + CHUNK_SIZE/2, 0.03, 0.03, CHUNK_SIZE, rb));
  
  return boxes;
}

function buildChunkMesh(boxes){
  const n = boxes.length;
  if(n === 0){
    const geo = new THREE.BufferGeometry();
    geo.setAttribute('position', new THREE.BufferAttribute(new Float32Array(0), 3));
    return new THREE.Mesh(geo, new THREE.MeshBasicMaterial({ color: 0x000000 }));
  }
  
  const positions = new Float32Array(n * VERTS_PER_BOX * 3);
  const normals = new Float32Array(n * VERTS_PER_BOX * 3);
  const colors = new Float32Array(n * VERTS_PER_BOX * 3);
  let vOff = 0;
  
  for(let bi = 0; bi < n; bi++){
    const b = boxes[bi];
    for(let i = 0; i < VERTS_PER_BOX; i++){
      const lx = BASE_POS[i*3], ly = BASE_POS[i*3+1], lz = BASE_POS[i*3+2];
      const idx = (vOff + i) * 3;
      positions[idx] = b.x + lx * b.w;
      positions[idx+1] = b.y + ly * b.h;
      positions[idx+2] = b.z + lz * b.d;
      normals[idx] = BASE_NORM[i*3];
      normals[idx+1] = BASE_NORM[i*3+1];
      normals[idx+2] = BASE_NORM[i*3+2];
      colors[idx] = b.color.r;
      colors[idx+1] = b.color.g;
      colors[idx+2] = b.color.b;
    }
    vOff += VERTS_PER_BOX;
  }
  
  const geo = new THREE.BufferGeometry();
  geo.setAttribute('position', new THREE.BufferAttribute(positions, 3));
  geo.setAttribute('normal', new THREE.BufferAttribute(normals, 3));
  geo.setAttribute('color', new THREE.BufferAttribute(colors, 3));
  
  const mat = new THREE.MeshStandardMaterial({
    vertexColors: true,
    roughness: 0.7,
    metalness: 0.05,
    transparent: true,
    opacity: 0
  });
  
  const mesh = new THREE.Mesh(geo, mat);
  mesh.frustumCulled = true;
  mesh.userData.boxes = boxes;
  return mesh;
}

/* ---------------- STREAMING OTIMIZADO ---------------- */
const chunkGroup = new THREE.Group();
scene.add(chunkGroup);
const chunkMap = new Map();
const buildingSet = new Set();
let collidablesList = [];

function rebuildCollidables(){ collidablesList = chunkGroup.children; }
function chunkKey(cx, cz, floor){ return cx+','+cz+','+floor; }
function getFloorFromY(y){ return Math.round(y / 4); }

function requestChunk(cx, cz, floor){
  const key = chunkKey(cx, cz, floor);
  if(chunkMap.has(key) || buildingSet.has(key)) return;
  buildingSet.add(key);
  const boxes = generateArchitecture(cx, cz, floor);
  const mesh = buildChunkMesh(boxes);
  chunkGroup.add(mesh);
  chunkMap.set(key, {cx, cz, floor, mesh, state:'in', alpha:0});
  buildingSet.delete(key);
  rebuildCollidables();
}

function unloadChunk(key){
  const c = chunkMap.get(key);
  if(!c) return;
  chunkGroup.remove(c.mesh);
  if(c.mesh.geometry) c.mesh.geometry.dispose();
  if(c.mesh.material) c.mesh.material.dispose();
  chunkMap.delete(key);
  rebuildCollidables();
}

let loadingComplete = false;

function nearestMissingChunks(px, py, pz, radius){
  const currentFloor = getFloorFromY(py);
  const floorRange = Math.ceil(radius / 4) + 1;
  const rC = Math.ceil(radius / CHUNK_SIZE);
  const pcx = Math.floor(px / CHUNK_SIZE), pcz = Math.floor(pz / CHUNK_SIZE);
  const list = [];
  
  for(let floor = currentFloor - floorRange; floor <= currentFloor + floorRange; floor++){
    const floorY = floor * 4;
    const dy = floorY - py;
    if(Math.abs(dy) > radius + 4) continue;
    for(let cx = pcx - rC; cx <= pcx + rC; cx++){
      for(let cz = pcz - rC; cz <= pcz + rC; cz++){
        const dx = cx * CHUNK_SIZE + CHUNK_SIZE/2 - px;
        const dz = cz * CHUNK_SIZE + CHUNK_SIZE/2 - pz;
        const dist = Math.hypot(dx, dy, dz);
        if(dist > radius) continue;
        const key = chunkKey(cx, cz, floor);
        if(chunkMap.has(key) || buildingSet.has(key)) continue;
        list.push({cx, cz, floor, dist});
      }
    }
  }
  list.sort((a,b) => a.dist - b.dist);
  return list;
}

function updateStreaming(px, py, pz, budget){
  const candidates = nearestMissingChunks(px, py, pz, ACTIVE_RADIUS);
  const toLoad = Math.min(budget, candidates.length);
  for(let i = 0; i < toLoad; i++){
    requestChunk(candidates[i].cx, candidates[i].cz, candidates[i].floor);
  }
  
  for(const [key, c] of chunkMap){
    const dx = c.cx * CHUNK_SIZE + CHUNK_SIZE/2 - px;
    const dz = c.cz * CHUNK_SIZE + CHUNK_SIZE/2 - pz;
    const dy = c.floor * 4 - py;
    const dist = Math.hypot(dx, dy, dz);
    if(dist > UNLOAD_RADIUS && c.state !== 'out'){ c.state = 'out'; }
    else if(dist <= ACTIVE_RADIUS && c.state === 'out'){ c.state = 'in'; }
  }
}

function animateChunks(dt){
  for(const [key, c] of chunkMap){
    if(c.state === 'in'){
      c.alpha = Math.min(1, c.alpha + dt/FADE_TIME);
      c.mesh.material.opacity = c.alpha;
      if(c.alpha >= 1) c.state = 'active';
    } else if(c.state === 'out'){
      c.alpha = Math.max(0, c.alpha - dt/FADE_TIME);
      c.mesh.material.opacity = c.alpha;
      if(c.alpha <= 0) unloadChunk(key);
    }
  }
}

/* ===== PLAYER ===== */
const player = { position: new THREE.Vector3(0, EYE_HEIGHT, 0) };
let yaw = 0, pitch = 0;
let velocityY = 0, grounded = true, running = false, wantsJump = false;
const raycaster = new THREE.Raycaster();
const _fwd = new THREE.Vector3(), _right = new THREE.Vector3();

function updateFirstPersonCamera(){
  camera.position.copy(player.position);
  camera.rotation.set(pitch, yaw, 0, 'YXZ');
}

function updatePhysics(dt, inForward, inStrafe){
  const speed = WALK_SPEED * (running ? RUN_MULT : 1);
  _fwd.set(-Math.sin(yaw), 0, -Math.cos(yaw));
  _right.set(Math.cos(yaw), 0, -Math.sin(yaw));
  
  let mx = _fwd.x * inForward + _right.x * inStrafe;
  let mz = _fwd.z * inForward + _right.z * inStrafe;
  const len = Math.hypot(mx, mz);
  if(len > 1){ mx /= len; mz /= len; }
  
  let dx = mx * speed * dt;
  let dz = mz * speed * dt;
  const rayY = (player.position.y - EYE_HEIGHT) + 0.7;
  
  if(Math.abs(dx) > 1e-6){
    raycaster.set(new THREE.Vector3(player.position.x, rayY, player.position.z), new THREE.Vector3(Math.sign(dx), 0, 0));
    raycaster.far = PLAYER_RADIUS + Math.abs(dx) + 0.04;
    const hits = raycaster.intersectObjects(collidablesList, false);
    if(hits.length > 0){
      const allowed = Math.max(0, hits[0].distance - PLAYER_RADIUS - 0.02);
      dx = Math.sign(dx) * Math.min(Math.abs(dx), allowed);
    }
  }
  player.position.x += dx;
  
  if(Math.abs(dz) > 1e-6){
    raycaster.set(new THREE.Vector3(player.position.x, rayY, player.position.z), new THREE.Vector3(0, 0, Math.sign(dz)));
    raycaster.far = PLAYER_RADIUS + Math.abs(dz) + 0.04;
    const hits = raycaster.intersectObjects(collidablesList, false);
    if(hits.length > 0){
      const allowed = Math.max(0, hits[0].distance - PLAYER_RADIUS - 0.02);
      dz = Math.sign(dz) * Math.min(Math.abs(dz), allowed);
    }
  }
  player.position.z += dz;
  
  velocityY += GRAVITY * dt;
  if(velocityY < -MAX_FALL_SPEED) velocityY = -MAX_FALL_SPEED;
  if(wantsJump && grounded){
    velocityY = running ? JUMP_SPEED_RUN : JUMP_SPEED_NORMAL;
    grounded = false;
  }
  wantsJump = false;
  player.position.y += velocityY * dt;
  
  const downOrigin = new THREE.Vector3(player.position.x, (player.position.y - EYE_HEIGHT) + 0.9, player.position.z);
  raycaster.set(downOrigin, new THREE.Vector3(0, -1, 0));
  raycaster.far = Math.max(5, Math.abs(velocityY) * dt + 2);
  const groundHits = raycaster.intersectObjects(collidablesList, false);
  if(groundHits.length > 0){
    const groundY = groundHits[0].point.y;
    const currentFeet = player.position.y - EYE_HEIGHT;
    if(currentFeet <= groundY + 0.12 && velocityY <= 0){
      player.position.y = groundY + EYE_HEIGHT;
      velocityY = 0;
      grounded = true;
    } else { grounded = false; }
  } else {
    grounded = false;
    if(player.position.y - EYE_HEIGHT < -20){
      player.position.y = getFloorFromY(player.position.y) * 4 + EYE_HEIGHT + 2;
      velocityY = 0;
    }
  }
  
  playerGroup.position.copy(player.position);
  playerGroup.position.y -= EYE_HEIGHT;
  playerGroup.rotation.y = yaw;
  updateFirstPersonCamera();
  
  document.getElementById('hudFloor').textContent = getFloorFromY(player.position.y);
  document.getElementById('hudRoom').textContent = Math.floor(player.position.x/8)+','+Math.floor(player.position.z/8);
}

/* ===== INPUT ===== */
let mode = null;
const keys = {};
let pointerLocked = false;

window.addEventListener('keydown', (e)=>{
  keys[e.code] = true;
  if(e.code === 'Space'){ wantsJump = true; e.preventDefault(); }
  if(e.code === 'KeyQ'){ running = true; }
});
window.addEventListener('keyup', (e)=>{
  keys[e.code] = false;
  if(e.code === 'KeyQ'){ running = false; }
});

canvas.addEventListener('click', ()=>{
  if(!pointerLocked && mode === 'pc'){ canvas.requestPointerLock(); }
});
document.addEventListener('pointerlockchange', ()=>{
  pointerLocked = (document.pointerLockElement === canvas);
});
document.addEventListener('mousemove', (e)=>{
  if(mode !== 'pc' || !pointerLocked) return;
  yaw -= e.movementX * 0.0022;
  pitch -= e.movementY * 0.0022;
  pitch = Math.max(-Math.PI/2 + 0.02, Math.min(Math.PI/2 - 0.02, pitch));
});

function pcInputVector(){
  let f=0, s=0;
  if(keys['KeyW']) f += 1;
  if(keys['KeyS']) f -= 1;
  if(keys['KeyD']) s += 1;
  if(keys['KeyA']) s -= 1;
  return {f,s};
}

/* ===== MOBILE ===== */
const joystickZone = document.getElementById('joystickZone');
const joystickKnob = document.getElementById('joystickKnob');
const camLookZone = document.getElementById('camLookZone');
const btnJump = document.getElementById('btnJump');
const btnRun = document.getElementById('btnRun');

let joyVec = {x:0,y:0}, joyId = null;
let lookId = null, lookLast = {x:0,y:0};

function joyCenter(){
  const r = joystickZone.getBoundingClientRect();
  return {x: r.left + r.width/2, y: r.top + r.height/2, radius: r.width/2};
}

joystickZone.addEventListener('touchstart', (e)=>{
  e.preventDefault();
  const t = e.changedTouches[0];
  joyId = t.identifier;
  const c = joyCenter();
  let dx = t.clientX - c.x, dy = t.clientY - c.y;
  const dist = Math.hypot(dx, dy);
  const max = c.radius;
  if(dist > max){ dx = dx/dist * max; dy = dy/dist * max; }
  joyVec.x = dx/max; joyVec.y = dy/max;
  joystickKnob.style.left = (30 + dx) + 'px';
  joystickKnob.style.top = (30 + dy) + 'px';
}, {passive:false});

joystickZone.addEventListener('touchmove', (e)=>{
  e.preventDefault();
  for(const t of e.changedTouches){
    if(t.identifier !== joyId) continue;
    const c = joyCenter();
    let dx = t.clientX - c.x, dy = t.clientY - c.y;
    const dist = Math.hypot(dx, dy);
    const max = c.radius;
    if(dist > max){ dx = dx/dist * max; dy = dy/dist * max; }
    joyVec.x = dx/max; joyVec.y = dy/max;
    joystickKnob.style.left = (30 + dx) + 'px';
    joystickKnob.style.top = (30 + dy) + 'px';
  }
}, {passive:false});

function endJoy(e){
  for(const t of e.changedTouches){
    if(t.identifier === joyId){
      joyId = null; joyVec = {x:0,y:0};
      joystickKnob.style.left = '30px'; joystickKnob.style.top = '30px';
    }
  }
}
joystickZone.addEventListener('touchend', endJoy);
joystickZone.addEventListener('touchcancel', endJoy);

camLookZone.addEventListener('touchstart', (e)=>{
  for(const t of e.changedTouches){
    if(t.identifier === joyId) continue;
    if(lookId === null){ lookId = t.identifier; lookLast = {x:t.clientX, y:t.clientY}; }
  }
}, {passive:true});

camLookZone.addEventListener('touchmove', (e)=>{
  for(const t of e.changedTouches){
    if(t.identifier !== lookId) continue;
    const dx = t.clientX - lookLast.x, dy = t.clientY - lookLast.y;
    lookLast = {x:t.clientX, y:t.clientY};
    yaw -= dx * 0.004;
    pitch -= dy * 0.004;
    pitch = Math.max(-Math.PI/2 + 0.02, Math.min(Math.PI/2 - 0.02, pitch));
  }
}, {passive:true});

function endLook(e){
  for(const t of e.changedTouches){ if(t.identifier === lookId) lookId = null; }
}
camLookZone.addEventListener('touchend', endLook);
camLookZone.addEventListener('touchcancel', endLook);

btnJump.addEventListener('touchstart', (e)=>{ e.preventDefault(); wantsJump = true; }, {passive:false});
btnRun.addEventListener('touchstart', (e)=>{
  e.preventDefault();
  running = !running;
  btnRun.classList.toggle('active', running);
}, {passive:false});

function mobileInputVector(){
  return { f: -joyVec.y, s: joyVec.x };
}

/* ===== START ===== */
function beginGame(selectedModeArg){
  mode = selectedModeArg;
  document.getElementById('loadingScreen').style.display = 'flex';
  document.getElementById('loadingLabel').textContent = 'CARREGANDO 0%';
  document.getElementById('loadingBarInner').style.width = '0%';
  
  // Spawn em local aberto (centro do chunk 0,0)
  player.position.set(0, EYE_HEIGHT, 0);
  velocityY = 0; grounded = true;
  yaw = 0; pitch = 0;
  camera.position.copy(player.position);
  loadingComplete = false;
  started = false;
  
  createPlayer();
  playerGroup.position.copy(player.position);
  playerGroup.position.y -= EYE_HEIGHT;
  playerGroup.rotation.y = yaw;
  playerGroup.visible = true;
  
  chunkMap.clear();
  while(chunkGroup.children.length > 0){
    const child = chunkGroup.children[0];
    chunkGroup.remove(child);
    if(child.geometry) child.geometry.dispose();
    if(child.material) child.material.dispose();
  }
  rebuildCollidables();
  
  animate();
}

/* ===== LOADING ===== */
const loadingScreen = document.getElementById('loadingScreen');
const loadingLabel = document.getElementById('loadingLabel');
const loadingBarInner = document.getElementById('loadingBarInner');
const hud = document.getElementById('hud');
const crosshair = document.getElementById('crosshair');
const pcHint = document.getElementById('pcHint');
const mobileControls = document.getElementById('mobileControls');

const NEEDED_INITIAL = (() => {
  const rC = Math.ceil(INITIAL_RADIUS / CHUNK_SIZE);
  const fR = Math.ceil(INITIAL_RADIUS / 4) + 1;
  let n = 0;
  for(let f = -fR; f <= fR; f++){
    for(let cx = -rC; cx <= rC; cx++){
      for(let cz = -rC; cz <= rC; cz++){
        const dist = Math.hypot(cx*CHUNK_SIZE + CHUNK_SIZE/2, cz*CHUNK_SIZE + CHUNK_SIZE/2, f*4);
        if(dist <= INITIAL_RADIUS) n++;
      }
    }
  }
  return n;
})();

function initialLoadStep(){
  const list = nearestMissingChunks(0, 0, 0, INITIAL_RADIUS);
  const batch = Math.min(20, list.length);
  for(let i = 0; i < batch; i++){
    requestChunk(list[i].cx, list[i].cz, list[i].floor);
  }
  
  const loaded = [...chunkMap.values()].filter(c => {
    const dist = Math.hypot(c.cx*CHUNK_SIZE + CHUNK_SIZE/2, c.cz*CHUNK_SIZE + CHUNK_SIZE/2, c.floor*4);
    return dist <= INITIAL_RADIUS;
  }).length;
  
  const pct = Math.min(100, Math.round((loaded / NEEDED_INITIAL) * 100));
  loadingBarInner.style.width = pct + '%';
  loadingLabel.textContent = 'CARREGANDO ' + pct + '%';
  
  for(const c of chunkMap.values()){
    c.alpha = 1;
    c.mesh.material.opacity = 1;
    c.state = 'active';
  }
  
  if(loaded >= NEEDED_INITIAL){
    loadingComplete = true;
    loadingScreen.style.display = 'none';
    hud.style.display = 'block';
    crosshair.style.display = 'block';
    if(mode === 'pc'){ pcHint.style.display = 'block'; }
    if(mode === 'mobile'){ mobileControls.style.display = 'block'; }
  }
}

let started = false;
const clock = new THREE.Clock();

function animate(){
  if(!started){ started = true; clock.start(); }
  requestAnimationFrame(animate);
  const dt = Math.min(clock.getDelta(), 0.05);
  
  if(!loadingComplete){ initialLoadStep(); renderer.render(scene, camera); return; }
  
  const inVec = mode === 'pc' ? pcInputVector() : mobileInputVector();
  updatePhysics(dt, inVec.f, inVec.s);
  
  _fwd.set(-Math.sin(yaw), 0, -Math.cos(yaw));
  updateStreaming(player.position.x, player.position.y, player.position.z, 3);
  animateChunks(dt);
  
  const pos = player.position;
  document.getElementById('hudPos').textContent = pos.x.toFixed(1) + ', ' + (pos.y - EYE_HEIGHT).toFixed(1) + ', ' + pos.z.toFixed(1);
  
  renderer.render(scene, camera);
}

animate();

})();
</script>
