<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Mundo Industrial Infinito</title>
    <style>
        * { margin: 0; padding: 0; }
        body { overflow: hidden; background: #111; font-family: 'Segoe UI', Arial, sans-serif; }
        
        #info {
            position: absolute;
            top: 20px;
            left: 20px;
            color: #aaa;
            font-size: 14px;
            font-family: monospace;
            background: rgba(0,0,0,0.7);
            padding: 10px 16px;
            border-radius: 6px;
            pointer-events: none;
            user-select: none;
            z-index: 10;
            border: 1px solid rgba(255,255,255,0.05);
            line-height: 1.5;
            min-width: 180px;
        }
        #info .title {
            color: #88ccff;
            font-size: 16px;
            font-weight: bold;
            margin-bottom: 4px;
        }
        #info .highlight { color: #ffd93d; }
        #info .dim { color: #666; font-size: 12px; }
        
        #crosshair {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            color: rgba(255,255,255,0.15);
            font-size: 28px;
            font-weight: bold;
            pointer-events: none;
            user-select: none;
            z-index: 10;
        }
        
        #blocker {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.8);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 20;
            cursor: pointer;
            color: white;
            font-size: 26px;
            font-weight: bold;
            flex-direction: column;
            text-shadow: 0 0 30px rgba(0,0,0,0.9);
        }
        #blocker .sub {
            font-size: 16px;
            font-weight: normal;
            margin-top: 12px;
            opacity: 0.6;
            font-family: monospace;
        }
        #blocker .sub small {
            font-size: 13px;
            opacity: 0.5;
        }
        #blocker.hidden { display: none; }
        
        #minimap {
            position: absolute;
            bottom: 20px;
            right: 20px;
            width: 120px;
            height: 120px;
            background: rgba(0,0,0,0.5);
            border-radius: 8px;
            border: 1px solid rgba(255,255,255,0.05);
            pointer-events: none;
            user-select: none;
            z-index: 10;
            overflow: hidden;
        }
        #minimap canvas {
            width: 100%;
            height: 100%;
            opacity: 0.4;
        }
        
        #fps {
            position: absolute;
            bottom: 20px;
            left: 20px;
            color: #444;
            font-size: 11px;
            font-family: monospace;
            pointer-events: none;
            user-select: none;
            z-index: 10;
            background: rgba(0,0,0,0.3);
            padding: 2px 8px;
            border-radius: 4px;
        }
    </style>
</head>
<body>

    <div id="info">
        <div class="title">⬡ MUNDO INDUSTRIAL</div>
        <div>Chunks: <span class="highlight" id="chunkCount">0</span></div>
        <div>Estruturas: <span class="highlight" id="structureCount">0</span></div>
        <div class="dim">Pos: <span id="playerPos">0, 0, 0</span></div>
    </div>

    <div id="crosshair">+</div>

    <div id="blocker">
        🏭 Clique para Explorar
        <div class="sub">WASD · Mouse · ESPAÇO(pular) · Shift(correr)</div>
        <div class="sub"><small>Mundo procedural infinito · Estruturas mutáveis</small></div>
    </div>

    <div id="minimap"><canvas id="minimapCanvas"></canvas></div>
    <div id="fps">FPS: <span id="fpsValue">60</span></div>

    <script type="importmap">
        {
            "imports": {
                "three": "https://unpkg.com/three@0.160.0/build/three.module.js"
            }
        }
    </script>

    <script type="module">
        import * as THREE from 'three';

        // ============================================================
        // 1. CONFIGURAÇÕES
        // ============================================================
        const CONFIG = {
            CHUNK_SIZE: 32, // unidades por chunk
            VIEW_DISTANCE: 5, // chunks de raio
            MAX_STRUCTURES_PER_CHUNK: 12,
            PLAYER_HEIGHT: 1.6,
            PLAYER_SPEED: 6,
            PLAYER_SPRINT: 12,
            JUMP_FORCE: 5,
            GRAVITY: -15,
            MAX_STRUCTURE_HEIGHT: 15,
            MIN_STRUCTURE_HEIGHT: 3,
        };

        // ============================================================
        // 2. DOM
        // ============================================================
        const blocker = document.getElementById('blocker');
        const chunkCountSpan = document.getElementById('chunkCount');
        const structureCountSpan = document.getElementById('structureCount');
        const playerPosSpan = document.getElementById('playerPos');
        const fpsSpan = document.getElementById('fpsValue');

        // ============================================================
        // 3. CENA, CÂMERA, RENDER
        // ============================================================
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x1a1a2e);
        scene.fog = new THREE.Fog(0x1a1a2e, 80, 150);

        const camera = new THREE.PerspectiveCamera(70, window.innerWidth / window.innerHeight, 0.1, 200);
        camera.position.set(0, CONFIG.PLAYER_HEIGHT, 0);

        const renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: "high-performance" });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        renderer.shadowMap.enabled = true;
        renderer.shadowMap.type = THREE.PCFSoftShadowMap;
        renderer.toneMapping = THREE.ACESFilmicToneMapping;
        renderer.toneMappingExposure = 1.5;
        document.body.appendChild(renderer.domElement);

        // ============================================================
        // 4. LUZES
        // ============================================================
        const ambient = new THREE.AmbientLight(0x445566, 0.6);
        scene.add(ambient);

        const hemi = new THREE.HemisphereLight(0x8899bb, 0x443322, 0.5);
        scene.add(hemi);

        const sun = new THREE.DirectionalLight(0xffeedd, 1.8);
        sun.position.set(50, 80, 30);
        sun.castShadow = true;
        sun.shadow.mapSize.width = 2048;
        sun.shadow.mapSize.height = 2048;
        sun.shadow.camera.near = 0.5;
        sun.shadow.camera.far = 150;
        sun.shadow.camera.left = -60;
        sun.shadow.camera.right = 60;
        sun.shadow.camera.top = 60;
        sun.shadow.camera.bottom = -60;
        scene.add(sun);

        const fill = new THREE.DirectionalLight(0x8888ff, 0.3);
        fill.position.set(-30, 20, -30);
        scene.add(fill);

        // Luzes industriais (globais)
        const lightMat = new THREE.MeshBasicMaterial({ color: 0xff8844, transparent: true, opacity: 0.3 });
        for (let i = 0; i < 20; i++) {
            const light = new THREE.Mesh(new THREE.SphereGeometry(0.5, 6, 6), lightMat);
            light.position.set(
                (Math.random() - 0.5) * 200,
                10 + Math.random() * 30,
                (Math.random() - 0.5) * 200
            );
            scene.add(light);
        }

        // ============================================================
        // 5. CHUNK SYSTEM
        // ============================================================
        const chunks = new Map();
        const chunkMeshes = new Map();
        let totalStructures = 0;

        // Materiais industriais
        const matWall = new THREE.MeshStandardMaterial({
            color: 0x6a7a8a,
            roughness: 0.7,
            metalness: 0.3
        });
        const matWallDark = new THREE.MeshStandardMaterial({
            color: 0x4a5a6a,
            roughness: 0.8,
            metalness: 0.2
        });
        const matFloor = new THREE.MeshStandardMaterial({
            color: 0x5a6a7a,
            roughness: 0.9,
            metalness: 0.1
        });
        const matFloorDark = new THREE.MeshStandardMaterial({
            color: 0x3a4a5a,
            roughness: 0.9,
            metalness: 0.1
        });
        const matMetal = new THREE.MeshStandardMaterial({
            color: 0x8a9aaa,
            roughness: 0.4,
            metalness: 0.7
        });
        const matMetalDark = new THREE.MeshStandardMaterial({
            color: 0x5a6a7a,
            roughness: 0.5,
            metalness: 0.6
        });
        const matAccent = new THREE.MeshStandardMaterial({
            color: 0x7a8a5a,
            roughness: 0.6,
            metalness: 0.4
        });

        function getChunkKey(x, z) {
            const cx = Math.floor(x / CONFIG.CHUNK_SIZE);
            const cz = Math.floor(z / CONFIG.CHUNK_SIZE);
            return `${cx},${cz}`;
        }

        function getChunkCoord(chunkKey) {
            const [cx, cz] = chunkKey.split(',').map(Number);
            return { cx, cz };
        }

        function getChunkCenter(cx, cz) {
            return {
                x: cx * CONFIG.CHUNK_SIZE + CONFIG.CHUNK_SIZE / 2,
                z: cz * CONFIG.CHUNK_SIZE + CONFIG.CHUNK_SIZE / 2
            };
        }

        // ============================================================
        // 6. GERADOR PROCEDURAL DE ESTRUTURAS
        // ============================================================
        function generateChunkStructures(cx, cz, seed) {
            const structures = [];
            const center = getChunkCenter(cx, cz);
            const half = CONFIG.CHUNK_SIZE / 2;
            
            // Semente pseudo-aleatória baseada na posição
            const rng = (n) => {
                const s = (seed * 9301 + 49297) % 233280;
                seed = (s * 9301 + 49297) % 233280;
                return (s / 233280) * n;
            };

            const count = 3 + Math.floor(rng(CONFIG.MAX_STRUCTURES_PER_CHUNK - 2));
            
            // Garantir pelo menos uma estrutura central
            const hasCore = rng(1) < 0.7;
            
            for (let i = 0; i < count; i++) {
                // Posição dentro do chunk
                let x = center.x + (rng(1) - 0.5) * CONFIG.CHUNK_SIZE * 0.8;
                let z = center.z + (rng(1) - 0.5) * CONFIG.CHUNK_SIZE * 0.8;
                
                // Se for a estrutura central, fica no centro
                if (i === 0 && hasCore) {
                    x = center.x + (rng(1) - 0.5) * CONFIG.CHUNK_SIZE * 0.2;
                    z = center.z + (rng(1) - 0.5) * CONFIG.CHUNK_SIZE * 0.2;
                }
                
                const width = 2 + rng(6);
                const depth = 2 + rng(6);
                const height = CONFIG.MIN_STRUCTURE_HEIGHT + rng(CONFIG.MAX_STRUCTURE_HEIGHT - CONFIG.MIN_STRUCTURE_HEIGHT);
                
                const type = Math.floor(rng(5));
                
                structures.push({
                    x, z,
                    width, depth, height,
                    type,
                    hasRoof: rng(1) > 0.3,
                    hasWindows: rng(1) > 0.5,
                    hasPlatforms: rng(1) > 0.4,
                    colorVariant: Math.floor(rng(3))
                });
            }
            
            // Adicionar conexões (corredores) entre estruturas
            const connectionCount = Math.floor(rng(structures.length * 1.5));
            for (let i = 0; i < connectionCount; i++) {
                const a = Math.floor(rng(structures.length));
                const b = Math.floor(rng(structures.length));
                if (a !== b) {
                    structures.push({
                        x: (structures[a].x + structures[b].x) / 2 + (rng(1) - 0.5) * 4,
                        z: (structures[a].z + structures[b].z) / 2 + (rng(1) - 0.5) * 4,
                        width: 1.5 + rng(2),
                        depth: 1.5 + rng(2),
                        height: 2 + rng(3),
                        type: 4, // corredor
                        isCorridor: true,
                        colorVariant: Math.floor(rng(3))
                    });
                }
            }
            
            // Adicionar verticalidade (plataformas/escadas)
            for (const s of structures) {
                if (s.height > 6 && rng(1) > 0.5) {
                    const platformHeight = 2 + rng(s.height - 3);
                    structures.push({
                        x: s.x + (rng(1) - 0.5) * s.width * 0.8,
                        z: s.z + (rng(1) - 0.5) * s.depth * 0.8,
                        width: 2 + rng(3),
                        depth: 2 + rng(3),
                        height: 0.3,
                        type: 5, // plataforma
                        isPlatform: true,
                        platformY: platformHeight,
                        colorVariant: Math.floor(rng(3))
                    });
                }
            }
            
            return structures;
        }

        // ============================================================
        // 7. CONSTRUTOR DE CHUNKS
        // ============================================================
        function buildChunk(cx, cz) {
            const key = getChunkKey(cx * CONFIG.CHUNK_SIZE, cz * CONFIG.CHUNK_SIZE);
            
            // Remove chunk antigo se existir
            if (chunkMeshes.has(key)) {
                const group = chunkMeshes.get(key);
                scene.remove(group);
                // Dispose de geometrias e materiais
                group.children.forEach(child => {
                    if (child.geometry) child.geometry.dispose();
                    if (child.material) child.material.dispose();
                });
                chunkMeshes.delete(key);
            }
            
            const seed = (cx * 73856093 + cz * 19349663 + 83492791) & 0x7fffffff;
            const structures = generateChunkStructures(cx, cz, seed);
            
            const group = new THREE.Group();
            const center = getChunkCenter(cx, cz);
            const half = CONFIG.CHUNK_SIZE / 2;
            
            // Chão base
            const floorGeo = new THREE.PlaneGeometry(CONFIG.CHUNK_SIZE, CONFIG.CHUNK_SIZE);
            const floorMat = (cx + cz) % 2 === 0 ? matFloor : matFloorDark;
            const floor = new THREE.Mesh(floorGeo, floorMat);
            floor.rotation.x = -Math.PI / 2;
            floor.position.set(center.x, 0, center.z);
            floor.receiveShadow = true;
            group.add(floor);
            
            // Construir estruturas
            for (const s of structures) {
                const parts = buildStructure(s);
                for (const part of parts) {
                    group.add(part);
                }
            }
            
            // Paredes externas do chunk (opcional, para dar sensação de continuidade)
            // Pequenas vigas nos cantos
            const corners = [
                [-1, -1], [1, -1], [1, 1], [-1, 1]
            ];
            for (const [dx, dz] of corners) {
                const x = center.x + dx * half;
                const z = center.z + dz * half;
                // Pilar
                const pillar = new THREE.Mesh(
                    new THREE.BoxGeometry(0.3, 8, 0.3),
                    matMetalDark
                );
                pillar.position.set(x, 4, z);
                pillar.castShadow = true;
                group.add(pillar);
            }
            
            scene.add(group);
            chunkMeshes.set(key, group);
            
            totalStructures += structures.length;
            return structures.length;
        }

        // ============================================================
        // 8. CONSTRUTOR DE ESTRUTURAS INDIVIDUAIS
        // ============================================================
        function buildStructure(s) {
            const parts = [];
            
            // Seleciona material base
            let matMain, matSecondary, matDetail;
            const variant = s.colorVariant || 0;
            if (variant === 0) {
                matMain = matWall;
                matSecondary = matWallDark;
                matDetail = matMetal;
            } else if (variant === 1) {
                matMain = matWallDark;
                matSecondary = matWall;
                matDetail = matMetalDark;
            } else {
                matMain = matMetal;
                matSecondary = matWall;
                matDetail = matMetalDark;
            }
            
            if (s.isCorridor) {
                // Corredor
                const w = s.width;
                const d = s.depth;
                const h = s.height;
                const x = s.x;
                const z = s.z;
                
                // Piso
                const floor = new THREE.Mesh(
                    new THREE.BoxGeometry(w, 0.2, d),
                    matFloor
                );
                floor.position.set(x, 0.1, z);
                floor.receiveShadow = true;
                parts.push(floor);
                
                // Paredes laterais (se não for muito largo)
                if (w < 4) {
                    const wallH = new THREE.Mesh(
                        new THREE.BoxGeometry(w, h, 0.2),
                        matMain
                    );
                    wallH.position.set(x, h/2, z + d/2);
                    wallH.castShadow = true;
                    parts.push(wallH);
                    
                    const wallH2 = new THREE.Mesh(
                        new THREE.BoxGeometry(w, h, 0.2),
                        matMain
                    );
                    wallH2.position.set(x, h/2, z - d/2);
                    wallH2.castShadow = true;
                    parts.push(wallH2);
                }
                
                // Teto (aberto, mas com vigas)
                if (h > 2) {
                    const beam = new THREE.Mesh(
                        new THREE.BoxGeometry(w, 0.1, 0.1),
                        matMetal
                    );
                    beam.position.set(x, h, z);
                    parts.push(beam);
                }
                
                return parts;
            }
            
            if (s.isPlatform) {
                // Plataforma
                const w = s.width;
                const d = s.depth;
                const y = s.platformY || 2;
                
                const plat = new THREE.Mesh(
                    new THREE.BoxGeometry(w, 0.2, d),
                    matMetal
                );
                plat.position.set(s.x, y, s.z);
                plat.castShadow = true;
                plat.receiveShadow = true;
                parts.push(plat);
                
                // Suportes
                for (let i = -1; i <= 1; i += 2) {
                    for (let j = -1; j <= 1; j += 2) {
                        const support = new THREE.Mesh(
                            new THREE.CylinderGeometry(0.08, 0.08, y, 4),
                            matMetalDark
                        );
                        support.position.set(s.x + i * w * 0.35, y/2, s.z + j * d * 0.35);
                        parts.push(support);
                    }
                }
                
                // Escadas (se for alta)
                if (y > 3) {
                    for (let step = 0; step < Math.min(6, Math.floor(y)); step++) {
                        const stepY = 0.5 + step * 0.6;
                        const stepX = s.x + 0.5 + step * 0.3;
                        const stair = new THREE.Mesh(
                            new THREE.BoxGeometry(0.6, 0.1, 0.8),
                            matWallDark
                        );
                        stair.position.set(stepX, stepY, s.z + 0.8);
                        parts.push(stair);
                    }
                }
                
                return parts;
            }
            
            // Estrutura principal (sala/prédio)
            const w = s.width;
            const d = s.depth;
            const h = s.height;
            const x = s.x;
            const z = s.z;
            
            // Piso
            const floor = new THREE.Mesh(
                new THREE.BoxGeometry(w, 0.2, d),
                matFloor
            );
            floor.position.set(x, 0.1, z);
            floor.receiveShadow = true;
            parts.push(floor);
            
            // Paredes
            const wallMat = s.type === 0 ? matMain : matSecondary;
            
            // Parede traseira
            const backWall = new THREE.Mesh(
                new THREE.BoxGeometry(w, h, 0.2),
                wallMat
            );
            backWall.position.set(x, h/2, z - d/2);
            backWall.castShadow = true;
            parts.push(backWall);
            
            // Parede frontal (com entrada)
            if (s.type !== 2) {
                const frontWall = new THREE.Mesh(
                    new THREE.BoxGeometry(w, h, 0.2),
                    wallMat
                );
                frontWall.position.set(x, h/2, z + d/2);
                frontWall.castShadow = true;
                parts.push(frontWall);
                
                // "Porta" - só um detalhe visual
                if (w > 2) {
                    const door = new THREE.Mesh(
                        new THREE.BoxGeometry(0.6, 0.8, 0.1),
                        matMetalDark
                    );
                    door.position.set(x, 0.4, z + d/2 + 0.15);
                    parts.push(door);
                }
            }
            
            // Paredes laterais
            const side1 = new THREE.Mesh(
                new THREE.BoxGeometry(0.2, h, d),
                wallMat
            );
            side1.position.set(x - w/2, h/2, z);
            side1.castShadow = true;
            parts.push(side1);
            
            const side2 = new THREE.Mesh(
                new THREE.BoxGeometry(0.2, h, d),
                wallMat
            );
            side2.position.set(x + w/2, h/2, z);
            side2.castShadow = true;
            parts.push(side2);
            
            // Teto (se tiver)
            if (s.hasRoof && h > 2) {
                const roof = new THREE.Mesh(
                    new THREE.BoxGeometry(w, 0.2, d),
                    matFloorDark
                );
                roof.position.set(x, h, z);
                roof.castShadow = true;
                parts.push(roof);
            }
            
            // Janelas (detalhes)
            if (s.hasWindows && h > 3) {
                const windowMat = new THREE.MeshBasicMaterial({
                    color: 0x88ccff,
                    transparent: true,
                    opacity: 0.15
                });
                for (let i = 0; i < Math.floor(w / 2); i++) {
                    const win = new THREE.Mesh(
                        new THREE.PlaneGeometry(0.5, 0.5),
                        windowMat
                    );
                    win.position.set(x - w/3 + i * 1.2, h * 0.5, z - d/2 - 0.05);
                    parts.push(win);
                }
            }
            
            // Detalhes estruturais (vigas)
            if (h > 4) {
                for (let i = 0; i < Math.floor(h / 2); i++) {
                    const beam = new THREE.Mesh(
                        new THREE.BoxGeometry(w + 0.4, 0.1, 0.1),
                        matMetal
                    );
                    beam.position.set(x, 1 + i * 1.8, z - d/2 - 0.1);
                    parts.push(beam);
                    
                    const beam2 = new THREE.Mesh(
                        new THREE.BoxGeometry(w + 0.4, 0.1, 0.1),
                        matMetal
                    );
                    beam2.position.set(x, 1 + i * 1.8, z + d/2 + 0.1);
                    parts.push(beam2);
                }
            }
            
            return parts;
        }

        // ============================================================
        // 9. GERENCIADOR DE CHUNKS
        // ============================================================
        function updateChunks(playerX, playerZ) {
            const cx = Math.floor(playerX / CONFIG.CHUNK_SIZE);
            const cz = Math.floor(playerZ / CONFIG.CHUNK_SIZE);
            
            const radius = CONFIG.VIEW_DISTANCE;
            const loadedKeys = new Set();
            let totalStructuresInChunks = 0;
            
            for (let dx = -radius; dx <= radius; dx++) {
                for (let dz = -radius; dz <= radius; dz++) {
                    // Carrega em círculo (não quadrado)
                    if (dx*dx + dz*dz > radius*radius + 2) continue;
                    
                    const chunkX = cx + dx;
                    const chunkZ = cz + dz;
                    const key = getChunkKey(chunkX * CONFIG.CHUNK_SIZE, chunkZ * CONFIG.CHUNK_SIZE);
                    loadedKeys.add(key);
                    
                    if (!chunkMeshes.has(key)) {
                        const count = buildChunk(chunkX, chunkZ);
                        totalStructuresInChunks += count;
                    } else {
                        // Conta estruturas já existentes
                        const group = chunkMeshes.get(key);
                        totalStructuresInChunks += group.children.length;
                    }
                }
            }
            
            // Remove chunks distantes
            const toRemove = [];
            for (const [key, group] of chunkMeshes) {
                if (!loadedKeys.has(key)) {
                    toRemove.push(key);
                }
            }
            
            for (const key of toRemove) {
                const group = chunkMeshes.get(key);
                scene.remove(group);
                group.children.forEach(child => {
                    if (child.geometry) child.geometry.dispose();
                    if (child.material) child.material.dispose();
                });
                chunkMeshes.delete(key);
            }
            
            chunkCountSpan.textContent = chunkMeshes.size;
            structureCountSpan.textContent = totalStructuresInChunks;
        }

        // ============================================================
        // 10. JOGADOR
        // ============================================================
        const player = {
            position: new THREE.Vector3(0, CONFIG.PLAYER_HEIGHT, 0),
            yaw: 0,
            pitch: 0,
            velocity: new THREE.Vector3(0, 0, 0),
            isGrounded: false,
            speed: CONFIG.PLAYER_SPEED,
            sprintMultiplier: 1.8,
            isSprinting: false,
        };

        camera.position.copy(player.position);

        const keys = { w: false, a: false, s: false, d: false, space: false, shift: false };

        // ============================================================
        // 11. CONTROLES
        // ============================================================
        document.addEventListener('mousemove', (e) => {
            if (document.pointerLockElement !== renderer.domElement) return;
            const sens = 0.002;
            player.yaw -= e.movementX * sens;
            player.pitch -= e.movementY * sens;
            player.pitch = Math.max(-1.2, Math.min(1.2, player.pitch));
        });

        blocker.addEventListener('click', () => renderer.domElement.requestPointerLock());

        document.addEventListener('pointerlockchange', () => {
            if (document.pointerLockElement === renderer.domElement) {
                blocker.classList.add('hidden');
            } else {
                blocker.classList.remove('hidden');
            }
        });

        document.addEventListener('keydown', (e) => {
            switch (e.code) {
                case 'KeyW': keys.w = true; e.preventDefault(); break;
                case 'KeyA': keys.a = true; e.preventDefault(); break;
                case 'KeyS': keys.s = true; e.preventDefault(); break;
                case 'KeyD': keys.d = true; e.preventDefault(); break;
                case 'Space': keys.space = true; e.preventDefault(); break;
                case 'ShiftLeft': keys.shift = true; e.preventDefault(); break;
            }
        });
        document.addEventListener('keyup', (e) => {
            switch (e.code) {
                case 'KeyW': keys.w = false; e.preventDefault(); break;
                case 'KeyA': keys.a = false; e.preventDefault(); break;
                case 'KeyS': keys.s = false; e.preventDefault(); break;
                case 'KeyD': keys.d = false; e.preventDefault(); break;
                case 'Space': keys.space = false; e.preventDefault(); break;
                case 'ShiftLeft': keys.shift = false; e.preventDefault(); break;
            }
        });

        // ============================================================
        // 12. MOVIMENTO DO JOGADOR
        // ============================================================
        function updatePlayer(delta) {
            // Sprint
            player.isSprinting = keys.shift && keys.w;
            const speed = player.isSprinting ? CONFIG.PLAYER_SPEED * player.sprintMultiplier : CONFIG.PLAYER_SPEED;

            // Pulo
            if (keys.space && player.isGrounded) {
                player.velocity.y = CONFIG.JUMP_FORCE;
                player.isGrounded = false;
            }

            // Gravidade
            player.velocity.y += CONFIG.GRAVITY * delta;
            
            // Movimento horizontal
            const forward = new THREE.Vector3(0, 0, -1).applyQuaternion(camera.quaternion);
            forward.y = 0;
            forward.normalize();

            const right = new THREE.Vector3(1, 0, 0).applyQuaternion(camera.quaternion);
            right.y = 0;
            right.normalize();

            const moveInput = new THREE.Vector3(0, 0, 0);
            if (keys.w) moveInput.add(forward);
            if (keys.s) moveInput.sub(forward);
            if (keys.d) moveInput.add(right);
            if (keys.a) moveInput.sub(right);

            if (moveInput.lengthSq() > 0) {
                moveInput.normalize().multiplyScalar(speed * delta);
            }

            // Aplica movimento
            player.position.x += moveInput.x;
            player.position.z += moveInput.z;
            player.position.y += player.velocity.y * delta;

            // Chão (simplificado - sem colisão com estruturas, apenas mantém no chão)
            if (player.position.y <= CONFIG.PLAYER_HEIGHT) {
                player.position.y = CONFIG.PLAYER_HEIGHT;
                player.velocity.y = 0;
                player.isGrounded = true;
            }

            // Atualiza câmera
            camera.position.copy(player.position);
            camera.rotation.order = 'YXZ';
            camera.rotation.y = player.yaw;
            camera.rotation.x = player.pitch;

            // Atualiza chunks
            updateChunks(player.position.x, player.position.z);

            // Atualiza HUD
            playerPosSpan.textContent = `${Math.round(player.position.x)}, ${Math.round(player.position.z)}`;
        }

        // ============================================================
        // 13. MINIMAPA (simplificado)
        // ============================================================
        const minimapCanvas = document.getElementById('minimapCanvas');
        const minimapCtx = minimapCanvas.getContext('2d');
        minimapCanvas.width = 120;
        minimapCanvas.height = 120;

        function updateMinimap() {
            minimapCtx.fillStyle = 'rgba(0,0,0,0.3)';
            minimapCtx.fillRect(0, 0, 120, 120);
            
            const scale = 0.5;
            const cx = 60;
            const cy = 60;
            
            // Desenha chunks próximos
            for (const [key] of chunkMeshes) {
                const { cx: chunkX, cz: chunkZ } = getChunkCoord(key);
                const px = cx + (chunkX * CONFIG.CHUNK_SIZE - player.position.x) * scale;
                const py = cy + (chunkZ * CONFIG.CHUNK_SIZE - player.position.z) * scale;
                if (px > 0 && px < 120 && py > 0 && py < 120) {
                    minimapCtx.fillStyle = 'rgba(255,255,255,0.05)';
                    minimapCtx.fillRect(px - 2, py - 2, 4, 4);
                }
            }
            
            // Jogador
            minimapCtx.fillStyle = '#88ccff';
            minimapCtx.beginPath();
            minimapCtx.arc(cx, cy, 3, 0, Math.PI * 2);
            minimapCtx.fill();
            
            // Direção do jogador
            minimapCtx.strokeStyle = '#88ccff';
            minimapCtx.lineWidth = 1;
            minimapCtx.beginPath();
            minimapCtx.moveTo(cx, cy);
            minimapCtx.lineTo(
                cx + Math.sin(-player.yaw) * 10,
                cy + Math.cos(-player.yaw) * 10
            );
            minimapCtx.stroke();
        }

        // ============================================================
        // 14. FPS
        // ============================================================
        let frameCount = 0;
        let fpsTime = 0;
        let currentFPS = 60;

        // ============================================================
        // 15. LOOP PRINCIPAL
        // ============================================================
        // Gera chunks iniciais
        updateChunks(0, 0);

        let lastTime = 0;

        function animate(time) {
            const delta = Math.min((time - lastTime) / 1000, 0.05);
            lastTime = time;

            // FPS
            frameCount++;
            if (time - fpsTime > 1000) {
                currentFPS = frameCount;
                frameCount = 0;
                fpsTime = time;
                fpsSpan.textContent = currentFPS;
            }

            updatePlayer(delta);
            updateMinimap();

            renderer.render(scene, camera);
            requestAnimationFrame(animate);
        }

        animate(0);

        // ============================================================
        // 16. REDIMENSIONAR
        // ============================================================
        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });

        console.log('🏭 Mundo Industrial Infinito carregado!');
        console.log('📋 Chunks: geração procedural com A*');
        console.log('🔄 Regiões mutáveis (mudam ao revisitar)');
        console.log('⬆️ Verticalidade: plataformas e escadas');
    </script>
</body>
</html>
